function csvDown(name,rows){
  const csv='\ufeff'+rows.map(r=>r.map(c=>{c=String(c==null?'':c);return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c;}).join(',')).join('\n');
  fileDown(name+'.csv',csv,'text/csv;charset=utf-8');
}
/* אקסל בעברית שומר CSV בקידוד ווינדוס ולא ב-UTF-8, ואז העברית נראית ג'יבריש.
   כאן מזהים את הקידוד לפי הבתים עצמם ומפענחים נכון בכל מקרה. */
function decodeSmart(buf,force){
  const b=new Uint8Array(buf);
  if(force){try{const t=new TextDecoder(force).decode(
    (force==='utf-8'&&b[0]===0xEF&&b[1]===0xBB&&b[2]===0xBF)?b.subarray(3):b);return t;}catch(e){}}
  if(b.length>2&&b[0]===0xEF&&b[1]===0xBB&&b[2]===0xBF)
    return new TextDecoder('utf-8').decode(b.subarray(3));
  if(b.length>1&&b[0]===0xFF&&b[1]===0xFE)
    return new TextDecoder('utf-16le').decode(b.subarray(2));
  if(b.length>1&&b[0]===0xFE&&b[1]===0xFF)
    return new TextDecoder('utf-16be').decode(b.subarray(2));
  let t=null;
  try{t=new TextDecoder('utf-8',{fatal:true}).decode(b);}catch(e){t=null;}
  if(t!=null&&t.indexOf('\uFFFD')<0)return t;
  try{return new TextDecoder('windows-1255').decode(b);}catch(e){}
  return new TextDecoder('utf-8').decode(b);
}
async function fileText(file){return decodeSmart(await file.arrayBuffer());}
/* מזהים את התו המפריד לפי מה שבאמת מופיע בשורות — פסיק, נקודה-פסיק, טאב או קו */
function sniffDelim(t){
  const head=t.split(/\r?\n/).slice(0,10).join('\n');
  const cand=[',',';','\t','|'];
  let best=',',bestN=0;
  cand.forEach(d=>{
    let n=0,q=false;
    for(let i=0;i<head.length;i++){
      const c=head[i];
      if(c==='"')q=!q;
      else if(!q&&c===d)n++;
    }
    if(n>bestN){bestN=n;best=d;}
  });
  return bestN?best:',';
}
function parseCSV(t,delim){
  const d=delim||sniffDelim(t);
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=c;}
    else{if(c==='"')q=true;else if(c===d){row.push(cur);cur='';}
      else if(c==='\n'){row.push(cur);cur='';rows.push(row);row=[];}
      else if(c!=='\r')cur+=c;}}
  if(cur!==''||row.length){row.push(cur);rows.push(row);}
  return rows.filter(r=>r.some(x=>String(x).trim()!==''));
}

}

/* =========================================================================
   הוצאות ישירות נוספות
   כל מה שלא נכנס דרך ספק או קבלן — שכר, כלים, רכב, קבלנות משנה קטנה.
   ========================================================================= */
function costsFor(pid){return (db.costs||[]).filter(c=>c.projectId===pid);}
function costForm(id,pid){
  const o=id?byId(db.costs,id):{projectId:pid||'',date:today(),cat:'עבודה עצמית'};
  const FS=[{k:'projectId',l:'פרויקט',t:'select',req:true,w:2,o:db.projects.map(p=>({v:p.id,l:p.name+' — '+client(p.clientId).name}))},
    {k:'cat',l:'סעיף תקציב',t:'select',o:BUDGET_CATS},
    {k:'date',l:'תאריך',t:'date'},
    {k:'desc',l:'תיאור',w:3},{k:'amount',l:'סכום (לפני מע״מ)',t:'number',step:'0.01'}];
  openModal(id?'עריכת הוצאה':'הוצאה ישירה חדשה',F(FS,o,'g4'),
    `<button class="btn" onclick="costSave('${id||''}')">שמירה</button>
     ${id?`<button class="btn dan" onclick="costDel('${id}')">מחיקה</button>`:''}
     <button class="btn sec" onclick="closeModal()">ביטול</button>`);
}
function costSave(id){
  const o=RF([{k:'projectId'},{k:'cat'},{k:'date'},{k:'desc'},{k:'amount',t:'number'}]);
  if(!o.projectId)return toast('צריך לבחור פרויקט');
  if(!o.amount)return toast('צריך למלא סכום');
  db.costs=db.costs||[];
  if(id)Object.assign(byId(db.costs,id),o); else {o.id=uid();db.costs.push(o);}
  logAct((id?'עדכון':'רישום')+' הוצאה ישירה '+money(o.amount)+' · '+project(o.projectId).name);
  save();closeModalSaved();render();
}
function costDel(id){
  if(!confirm('למחוק את ההוצאה?'))return;
  db.costs=db.costs.filter(c=>c.id!==id);logAct('מחיקת הוצאה ישירה');save();closeModalSaved();render();
}

/* =========================================================================
   בקרה תקציבית
   התקציב נקבע ברמת הפרויקט לפי סעיפים, והביצוע נמשך אוטומטית מהנתונים.
   ========================================================================= */
function actualByCat(pid){
  const x=projectPnL(pid);
  const a={};BUDGET_CATS.forEach(c=>a[c]=0);
  a['חומר ורכש']=x.buyCost+x.stockCost;
  a['קבלני משנה']=x.subCost;
  costsFor(pid).forEach(c=>{a[c.cat]=(a[c.cat]||0)+(Number(c.amount)||0);});
  return a;
}
function budgetOf(p){const b=p.budget||{};const o={};BUDGET_CATS.forEach(c=>o[c]=Number(b[c])||0);return o;}
function budgetRows(p){
  const B=budgetOf(p),A=actualByCat(p.id);
  return BUDGET_CATS.map(c=>({cat:c,plan:B[c],act:A[c]||0,left:B[c]-(A[c]||0),
    use:B[c]?((A[c]||0)/B[c]*100):((A[c]||0)?999:0)}));
}
function useBar(pctv){
  const w=Math.min(100,pctv||0);
  const cls=pctv>100?'over':(pctv>85?'warn':'');
  return `<div style="display:flex;align-items:center;gap:8px">
    <div class="bar-mini"><i class="${cls}" style="width:${w}%"></i></div>
    <span class="num" style="font-size:12px;font-weight:700;color:${pctv>100?'var(--red)':'var(--muted)'}">${pctv>900?'—':Math.round(pctv)+'%'}</span></div>`;
}
VIEWS.budget=function(){
  const fs=window._fb||(window._fb={pid:''});
  const list=fs.pid?db.projects.filter(p=>p.id===fs.pid):db.projects.filter(p=>p.status!=='הסתיים');
  let tPlan=0,tAct=0;
  list.forEach(p=>{const r=budgetRows(p);r.forEach(x=>{tPlan+=x.plan;tAct+=x.act;});});
  const over=list.filter(p=>{const r=budgetRows(p);return r.some(x=>x.plan&&x.act>x.plan);});

function centerOf(p){return p.center||'לא משויך';}
function groupPnL(keyFn){
  const g={};
  db.projects.forEach(p=>{
    const k=keyFn(p);g[k]=g[k]||{k,n:0,sum:0,rev:0,cost:0};
    const x=projectPnL(p.id);
    g[k].n++;g[k].sum+=x.contractSum;g[k].rev+=x.revenue;g[k].cost+=x.cost;
  });
  return Object.values(g).map(r=>({...r,profit:r.rev-r.cost,margin:r.rev?(r.rev-r.cost)/r.rev*100:0}))
    .sort((a,b)=>b.profit-a.profit);
}

   מחירון אחד לכל ספק — העלאה מאקסל מחליפה את הקודם ושומרת היסטוריה.
   ========================================================================= */
function plParty(pl){return pl.kind==='sub'?subc(pl.partyId):(pl.kind==='cli'?client(pl.partyId):supp(pl.partyId));}
function plCount(pl){return (pl.items||[]).length;}
function normKey(s){return String(s||'').trim().toLowerCase().replace(/[\s\-_.]/g,'');}
function plOf(kind,partyId){return (db.plists||[]).filter(p=>p.kind===kind&&p.partyId===partyId)
  .sort((a,b)=>(b.date||'').localeCompare(a.date||''))[0]||null;}
function plPrice(kind,partyId,sku,desc){
  const pl=plOf(kind,partyId);if(!pl)return null;
  const k=normKey(sku),n=normKey(desc);
  const it=(pl.items||[]).find(x=>(k&&normKey(x.sku)===k)||(n&&normKey(x.desc)===n));
  return it?Number(it.price)||0:null;
}

async function plFormFile(rid,files){
  const f=files[0];if(!f)return;
  if(/\.pdf$/i.test(f.name))return attAdd('plist',rid,files);
  try{
    const rows=await sheetRows(f);
    if(rows.length<2)return toast('הקובץ ריק או מכיל רק כותרות');
    if(brokenRows(rows)>0.25){
      const el0=document.getElementById('plNewInfo');
      if(el0)el0.innerHTML='<b style="color:var(--red)">הטקסט בקובץ לא נקרא נכון ולכן לא נקלט.</b> לשמור אותו באקסל כ-CSV UTF-8 ולגרור שוב, או לשמור את המחירון ואז "העלאת אקסל" — שם אפשר לבחור קידוד ידנית.';
      return toast('הקובץ משובש — לא נקלט');
    }
    const items=plRowsToItems(rows);
    if(!items.length)return toast('לא נמצאו שורות תקינות — לבדוק את סדר העמודות');
    window._plPending=items;
    const el=document.getElementById('plNewInfo');
    if(el)el.innerHTML='<b style="color:var(--green)">נקראו '+items.length+' פריטים מהקובץ</b> — ייכנסו למחירון בלחיצה על שמירה.'+
      '<div class="tbl-wrap" style="margin-top:8px"><table><thead><tr><th>מק״ט</th><th>תיאור</th><th>יחידה</th><th>מחיר</th></tr></thead><tbody>'+
      items.slice(0,4).map(i=>`<tr><td>${esc(i.sku)}</td><td>${esc(i.desc)}</td><td>${esc(i.unit)}</td><td class="num mono">${money2(i.price)}</td></tr>`).join('')+
      '</tbody></table></div><div class="hint">אם הטקסט לא נראה נכון או שהעמודות התבלבלו — שומרים, ובכפתור "העלאת אקסל" מתאימים את העמודות ידנית.</div>';

function subWorkTotal(w){return (w.lines||[]).reduce((s,l)=>s+(Number(l.qty)||0)*(Number(l.price)||0),0);}
function subMonitor(){
  const out=[];
  db.subs.forEach(s=>{
    const pids=[...new Set([...db.sinv.filter(i=>i.subId===s.id).map(i=>i.projectId),
                            ...(db.subwork||[]).filter(w=>w.subId===s.id).map(w=>w.projectId)])];
    pids.filter(Boolean).forEach(pid=>{
      const billed=db.sinv.filter(i=>i.subId===s.id&&i.projectId===pid)
        .reduce((m,i)=>Math.max(m,Number(i.cum)||0),0);
      const approved=(db.subwork||[]).filter(w=>w.subId===s.id&&w.projectId===pid)
        .reduce((a,w)=>a+subWorkTotal(w),0);
      const mat=db.moves.filter(m=>m.type==='ניפוק'&&m.subId===s.id&&m.projectId===pid)
        .reduce((a,m)=>a+(Number(m.qty)||0)*(Number(m.cost)||0),0);
      out.push({sub:s,pid,billed,approved,mat,gap:billed-approved,pl:plOf('sub',s.id)});
    });
  });
  return out.sort((a,b)=>Math.abs(b.gap)-Math.abs(a.gap));
}

function masterCandidates(){

/* =========================================================================

   שלבי הפרויקט, מי אחראי, ומה בפיגור — מקצה לקצה על ציר זמן אחד.
   ========================================================================= */
function taskLate(t){return t.status!=='הושלם'&&t.due&&t.due<today();}
function taskSoon(t){return t.status!=='הושלם'&&t.due&&t.due>=today()&&daysBetween(today(),t.due)<=7;}
function daysBetween(a,b){return Math.round((new Date(b)-new Date(a))/86400000);}
VIEWS.tasks=function(){
  const fs=window._tkf||(window._tkf={pj:'',st:'',own:''});
  if(me.role==='field'&&!fs.own)fs.own=me.id;
  let list=(db.tasks||[]).slice();
  if(fs.pj)list=list.filter(t=>t.projectId===fs.pj);
  if(fs.st)list=list.filter(t=>t.status===fs.st);
  if(fs.own)list=list.filter(t=>t.owner===fs.own);
  if(fs.q)list=list.filter(t=>[t.title,t.phase,project(t.projectId).name].join(' ').includes(fs.q));
  list.sort((a,b)=>(a.start||a.due||'').localeCompare(b.start||b.due||''));
  const late=list.filter(taskLate),done=list.filter(t=>t.status==='הושלם');
  const dates=list.flatMap(t=>[t.start,t.due]).concat([today()]).filter(Boolean).sort();
  let min=dates[0],max=dates[dates.length-1];
  const pad=Math.max(3,Math.round(daysBetween(min,max)*0.06));
  min=iso(new Date(new Date(min).getTime()-pad*86400000));
  max=iso(new Date(new Date(max).getTime()+pad*86400000));
  const span=Math.max(1,daysBetween(min,max));
  const posOf=d=>Math.max(0,Math.min(100,daysBetween(min,d)/span*100));
  document.getElementById('app').innerHTML=`
  <div class="head"><div><h1>משימות וגאנט</h1>
    <div class="sub">שלבי הביצוע של כל פרויקט על ציר זמן אחד</div></div>

    <div class="kpi ${late.length?'r':'g'}"><div class="l">בפיגור</div><div class="v">${late.length}</div>
      <div class="n">${late.length?late.slice(0,2).map(t=>t.title).join(', '):'הכל בזמן'}</div></div>
    <div class="kpi g"><div class="l">הושלמו</div><div class="v">${done.length}</div>
      <div class="n">${pct(done.length,list.length)}% מהמשימות</div></div>
    <div class="kpi a"><div class="l">התקדמות ממוצעת</div><div class="v">${list.length?Math.round(list.reduce((s,t)=>s+(Number(t.pct)||0),0)/list.length):0}%</div></div>
  </div>
  <div class="filters">
    <div class="f" style="min-width:210px"><label>חיפוש</label>
      <input value="${esc(fs.q||'')}" oninput="_tkf.q=this.value;render()" placeholder="שם משימה, שלב או פרויקט"></div>
    <div class="f"><label>פרויקט</label><select onchange="_tkf.pj=this.value;render()">
      <option value="">הכל</option>${db.projects.map(p=>`<option value="${p.id}" ${fs.pj===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div>
    <div class="f"><label>סטטוס</label><select onchange="_tkf.st=this.value;render()">
      <option value="">הכל</option>${TASK_STATUS.map(s=>`<option ${fs.st===s?'selected':''}>${s}</option>`).join('')}</select></div>
    <div class="f"><label>אחראי</label><select onchange="_tkf.own=this.value;render()">
      <option value="">הכל</option>${db.users.map(u=>`<option value="${u.id}" ${fs.own===u.id?'selected':''}>${esc(u.name)}</option>`).join('')}</select></div>
  </div>
  <div class="card gantt">${T([
    {l:'משימה',f:t=>`<b>${esc(t.title)}</b><div style="font-size:12px;color:var(--muted)">${esc(project(t.projectId).name)}${t.phase?' · '+esc(t.phase):''}</div>`},
    {l:'אחראי',f:t=>{const u=byId(db.users,t.owner);return u?esc(u.name):'—';}},
    {l:'תאריכים',f:t=>`${dt(t.start)} — ${dt(t.due)}`},
    {l:'סטטוס',f:t=>tag(t.status,{'לביצוע':'t-gray','בעבודה':'t-blue','ממתין':'t-amber','הושלם':'t-green'}[t.status])+
      (taskLate(t)?' '+tag('בפיגור','t-red'):'')},
    {l:'התקדמות',f:t=>useBar(Number(t.pct)||0)},
    {l:'ציר זמן',f:t=>{
      const a=t.start||t.due,b=t.due||t.start;if(!a)return '';
      const l=posOf(a),r=posOf(b);
      const cls=t.status==='הושלם'?'done':(taskLate(t)?'late':(taskSoon(t)?'soon':''));
      return `<div class="track"><i class="${cls}" style="inset-inline-start:${l}%;width:${Math.max(2,r-l)}%"></i>
        <span class="today" style="inset-inline-start:${posOf(today())}%"></span></div>`;}},
    {l:'',f:t=>`<button class="btn sec sm" onclick="taskForm('${t.id}')">עריכה</button>`}

function taskSave(id){
  const o=RF([{k:'title'},{k:'projectId'},{k:'phase'},{k:'owner'},{k:'start'},{k:'due'},{k:'status'},{k:'pct',t:'number'},{k:'note'}]);
  if(!o.title)return toast('צריך שם למשימה');
  if(!o.projectId)return toast('צריך לבחור פרויקט');

  db.tasks=db.tasks||[];

function taskDel(id){

  db.tasks=db.tasks.filter(t=>t.id!==id);logAct('מחיקת משימה');save();closeModalSaved();render();

function yeshRows(){
  const rows=[];
  db.cinv.filter(i=>i.status==='אושר'||i.status==='הוגש ללקוח').forEach(i=>{
    const c=contract(i.contractId),p=project(c.projectId),x=cinvCalc(i);
    rows.push({k:'cinv',id:i.id,num:i.num,date:i.date,cli:client(p.clientId),
      desc:c.name+' — '+p.name+' — חשבון לתקופה עד '+dt(i.periodTo),
      net:x.net,vat:x.vat,total:x.total,status:i.status,yeshNum:i.yeshNum,yeshDate:i.yeshDate});
  });
  (db.masters||[]).forEach(m=>{
    const t=masterTotals(m);
    rows.push({k:'master',id:m.id,num:m.num,date:m.date,cli:client(m.cliId),
      desc:'חשבון מרכז '+m.num+' — תקופה '+dt(m.periodFrom)+' עד '+dt(m.periodTo),
      net:t.net,vat:t.vat,total:t.total,status:'חשבון מרכז',yeshNum:m.yeshNum,yeshDate:m.yeshDate});
  });
  return rows.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
}

/* =========================================================================
   הצעות מחיר
   מכינים הצעה ללקוח — שורות מהמחירונים, מהמלאי או מכתב כמויות קיים —
   מדפיסים, שולחים, ובאישור הופכים אותה לחוזה עם כתב כמויות בלחיצה אחת.
   ========================================================================= */
const QUOTE_STATUS=['טיוטה','נשלחה','אושרה','אושרה חלקית','נדחתה','פגה','הוחלפה'];
const QSTAG={'טיוטה':'t-gray','נשלחה':'t-blue','אושרה':'t-green','אושרה חלקית':'t-green','נדחתה':'t-red','פגה':'t-amber','הוחלפה':'t-gray'};
const r2=n=>Math.round((Number(n)||0)*100)/100;
/* כל שורה מעוגלת לאגורות — כך שטור הסה״כ המודפס מסתכם בדיוק לסכום הביניים */
function qLineNet(l){return r2((Number(l.qty)||0)*(Number(l.price)||0)*(1-(Number(l.disc)||0)/100));}
function qLineCost(l){return r2((Number(l.qty)||0)*(Number(l.cost)||0));}
function quoteCalc(q){
  const lines=q.lines||[];
  const sub=r2(lines.reduce((s,l)=>s+qLineNet(l),0));
  const disc=r2(sub*((Number(q.discPct)||0)/100));
  const net=r2(sub-disc);
  const vatPct=(q.vat==null||q.vat==='')?VAT:Number(q.vat);
  const vat=r2(net*vatPct/100);
  const cost=r2(lines.reduce((s,l)=>s+qLineCost(l),0));
  return {sub,disc,net,vatPct,vat,total:r2(net+vat),cost,profit:r2(net-cost),margin:net?(net-cost)/net*100:0};
}
function quoteOpen(q){return ['טיוטה','נשלחה'].includes(quoteStatusOf(q));}
/* מספר להצעה מתוקנת: הצ-2026-0012 ← הצ-2026-0012/ב, /ג ... */
function quoteRevNum(num,rev){const L='אבגדהוזחטי';const base=String(num||'').replace(/\/[א-י]$/,'');return base+'/'+(L[Math.min(rev-1,9)]||rev);}
function quoteExpired(q){return q.status==='נשלחה'&&q.valid&&q.valid<today();}
function quoteStatusOf(q){return quoteExpired(q)?'פגה':q.status;}

/* ---------- השלמה אוטומטית להצעה: מחירון הלקוח, מחירוני ספקים, מלאי וכתבי כמויות ---------- */
function qCatalog(){
  const out={};
  const cid=fv('clientId');
  const add=(k,src,it,price,cost,pri)=>{
    if(!k)return;
    const cur=out[k]||(out[k]={sku:it.sku||'',desc:it.desc||'',unit:it.unit||'יח׳',price:null,cost:null,src:'',pri:99});
    if(price!=null&&(cur.price==null||pri<cur.pri)){cur.price=price;cur.src=src;cur.pri=pri;}
    if(cost!=null&&(cur.cost==null||cost<cur.cost))cur.cost=cost;
    if(!cur.sku&&it.sku)cur.sku=it.sku;
  };
  /* מחירון שסוכם עם הלקוח הזה — עדיפות ראשונה */
  const cpl=cid?plOf('cli',cid):null;
  if(cpl)(cpl.items||[]).forEach(it=>add(normKey(it.sku)||normKey(it.desc),'מחירון הלקוח',it,Number(it.price)||0,null,1));
  /* כתבי כמויות של חוזים קודמים — מחיר שכבר נמכר */
  db.contracts.forEach(c=>(c.boq||[]).forEach(l=>{
    const own=cid&&project(c.projectId).clientId===cid;
    add(normKey(l.sku)||normKey(l.desc),own?'חוזה קודם של הלקוח':'חוזה קודם',l,Number(l.price)||0,
      ((Number(l.cmat)||0)+(Number(l.clab)||0))||null,own?2:4);}));
  /* מלאי ומחירוני ספקים — עלות; המחיר ללקוח מוצע לפי מרווח ברירת מחדל */
  const mk=1+((Number(db.settings.quoteMarkup)||35)/100);
  db.stock.forEach(st=>{const c=Number(st.cost)||0;if(!c)return;
    add(normKey(st.sku)||normKey(st.desc),'מלאי',st,Math.round(c*mk*100)/100,c,5);});
  Object.values(acCatalog()).forEach(r=>{
    const ps=r.offers.map(o=>o.price).filter(p=>p>0);
    if(!ps.length)return;
    const min=Math.min(...ps);
    add(normKey(r.sku)||normKey(r.desc),'מחירון ספק',r,Math.round(min*mk*100)/100,min,6);
  });
  return out;
}
function qAcSearch(q){
  q=String(q||'').trim().toLowerCase();
  if(q.length<2)return [];
  return Object.values(qCatalog()).filter(r=>((r.sku||'')+' '+(r.desc||'')).toLowerCase().includes(q))
    .sort((a,b)=>a.pri-b.pri||String(a.desc).localeCompare(String(b.desc))).slice(0,8);
}

   ${['טיוטה','נשלחה','פגה'].includes(st)?`<button class="btn sec" onclick="quoteStatus('${id}','נדחתה')">נדחתה</button>`:''}

   ${!q.contractId?`<button class="btn sec" onclick="closeModal(true);quoteForm('${id}')">עריכה</button>`:''}`,true);

function quoteRevise(id){

  const n=deep(q);n.id=uid();n.num=quoteRevNum(q.num,rev);n.rev=rev;n.parentId=q.id;n.parentDate=q.date;

function quoteToContractDo(id){
  const q=byId(db.quotes,id);if(!q)return;
  const lines=qcLines(q);
  if(!lines.length)return toast('צריך לאשר לפחות שורה אחת');
  let pid=fv('qpj');
  if(pid==='__new__'){
    const p={id:uid(),name:q.title||('פרויקט '+q.num),clientId:q.clientId,status:'בהקמה',start:today(),disc:q.discipline||'',
      terms:q.terms||'',center:'',address:q.site||''};
    db.projects.push(p);pid=p.id;logAct('נפתח פרויקט '+p.name+' מהצעה '+q.num);
  }
  const x=quoteCalc(Object.assign({},q,{lines}));
  /* מחיר יחידה בכתב הכמויות = המחיר שהוצע אחרי הנחת השורה; ההנחה הכללית שורה נפרדת */
  const boq=lines.map(l=>({id:uid(),sku:l.sku||'',desc:l.desc||'',unit:l.unit||'יח׳',qty:Number(l.qty)||0,
    price:r2((Number(l.price)||0)*(1-(Number(l.disc)||0)/100)),cmat:Number(l.cost)||0,clab:0}));
  if(x.disc)boq.push({id:uid(),sku:'',desc:'הנחה כללית '+q.discPct+'% לפי הצעה '+q.num,unit:'קומפ',qty:1,price:-x.disc,cmat:0,clab:0});
  /* שארית עיגול — כדי שסכום החוזה יהיה בדיוק סכום ההצעה */
  const diff=r2(x.net-boq.reduce((s,l)=>s+(Number(l.qty)||0)*(Number(l.price)||0),0));
  if(Math.abs(diff)>=0.01)boq.push({id:uid(),sku:'',desc:'התאמת עיגול',unit:'קומפ',qty:1,price:diff,cmat:0,clab:0});
  const c={id:uid(),projectId:pid,name:fv('qcn')||('חוזה — '+q.num),discipline:q.discipline||'',
    number:'',quoteNum:q.num,quoteDate:q.date,quoteId:q.id,startDate:today(),retPct:Number(client(q.clientId).retPct)||0,boq};
  c.sum=r2(boqTotal(c));
  db.contracts.push(c);
  const partial=Math.abs(x.net-quoteCalc(q).net)>0.005;
  q.status=partial?'אושרה חלקית':'אושרה';q.contractId=c.id;q.projectId=pid;q.approvedNet=x.net;q.approvedAt=today();
  logAct('הצעה '+q.num+(partial?' אושרה חלקית':' אושרה')+' והפכה לחוזה '+c.name+' · '+money(c.sum));
  save();closeModalSaved();render();toast('נפתח חוזה עם כתב כמויות של '+boq.length+' סעיפים');
  conView(c.id);
}

function monthsBack(n){
  const out=[],d=new Date();d.setDate(1);
  for(let i=n-1;i>=0;i--){const x=new Date(d.getFullYear(),d.getMonth()-i,1);
    out.push({k:x.toISOString().slice(0,7),l:x.toLocaleDateString('he-IL',{month:'short'}),y:x.getFullYear()});}
  return out;
}
function monthFlow(months){
  const inc={},exp={};
  months.forEach(m=>{inc[m.k]=0;exp[m.k]=0;});
  db.cinv.filter(i=>i.status!=='טיוטה').forEach(i=>{
    const k=(i.periodTo||i.date||'').slice(0,7);if(inc[k]!=null)inc[k]+=cinvCalc(i).net;});
  db.sinv.forEach(i=>{const k=(i.periodTo||i.date||'').slice(0,7);if(exp[k]!=null)exp[k]+=sinvCalc(i).net;});
  db.pinv.forEach(i=>{const k=(i.date||'').slice(0,7);if(exp[k]!=null)exp[k]+=Number(i.net)||0;});
  (db.costs||[]).forEach(c=>{const k=(c.date||'').slice(0,7);if(exp[k]!=null)exp[k]+=Number(c.amount)||0;});
  return months.map(m=>({...m,inc:inc[m.k],exp:exp[m.k],net:inc[m.k]-exp[m.k]}));
}
function flowChart(){
  const rows=monthFlow(monthsBack(12));
  const max=Math.max(1,...rows.map(r=>Math.max(r.inc,r.exp)));
  const tI=rows.reduce((s,r)=>s+r.inc,0),tE=rows.reduce((s,r)=>s+r.exp,0);
  return `<div class="card pad">

      <h1 style="font-size:17px">הכנסות מול הוצאות</h1>

}

      stroke-dasharray="${len.toFixed(2)} ${(100-len).toFixed(2)}" stroke-dashoffset="${(25-off).toFixed(2)}"></circle>`;

  return `<div class="card pad">

/* =========================================================================
   קבצים מצורפים
   סריקות של חשבוניות, תעודות משלוח וכל מסמך אחר. כשיש סנכרון חי הקבצים
   נשמרים בענן ונפתחים אצל כולם; בלעדיו הם נשארים במחשב שבו הועלו.
   ========================================================================= */
const CHUNK=600000, MAXFILE=12*1024*1024;
const ATT_KINDS={pinv:'חשבונית ספק',dn:'תעודת משלוח',cinv:'חשבון ללקוח',sinv:'חשבון קבלן',
  po:'הזמנת רכש',contract:'חוזה',project:'פרויקט',client:'לקוח',supplier:'ספק',sub:'קבלן משנה',plist:'מחירון',quote:'הצעת מחיר'};
let _IDB=null;
function idbOpen(){
  return new Promise((res,rej)=>{
    if(_IDB)return res(_IDB);
    const r=indexedDB.open('vas_files',1);
    r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('f'))r.result.createObjectStore('f');};
    r.onsuccess=()=>{_IDB=r.result;res(_IDB);};
    r.onerror=()=>rej(r.error);
  });
}
async function idbPut(k,v){const d=await idbOpen();return new Promise((res,rej)=>{
  const t=d.transaction('f','readwrite');t.objectStore('f').put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);});}
async function idbGet(k){const d=await idbOpen();return new Promise((res,rej)=>{
  const t=d.transaction('f','readonly'),q=t.objectStore('f').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});}
async function idbDel(k){const d=await idbOpen();return new Promise((res)=>{
  const t=d.transaction('f','readwrite');t.objectStore('f').delete(k);t.oncomplete=()=>res();t.onerror=()=>res();});}

function readDataURL(file){return new Promise((res,rej)=>{
  const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(file);});}
/* סריקות מצטלמות גדול — מקטינים אותן כדי שהעלייה תהיה מהירה והאחסון קטן */
function shrinkImage(dataUrl,maxPx,q){
  return new Promise(res=>{
    const im=new Image();
    im.onload=()=>{
      let{width:w,height:h}=im;
      if(Math.max(w,h)<=maxPx&&dataUrl.length<900000)return res(dataUrl);
      const s=Math.min(1,maxPx/Math.max(w,h));
      const c=document.createElement('canvas');c.width=Math.round(w*s);c.height=Math.round(h*s);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      res(c.toDataURL('image/jpeg',q||0.72));
    };
    im.onerror=()=>res(dataUrl);
    im.src=dataUrl;
  });
}
function fileIcon(t){
  if(/^image\//.test(t))return '🖼';
  if(/pdf/.test(t))return '📄';
  if(/sheet|excel|csv/.test(t))return '📊';
  return '📎';
}
function humanSize(n){return n>1048576?(n/1048576).toFixed(1)+' MB':Math.round(n/1024)+' KB';}
function attOf(kind,refId){return (db.files||[]).filter(f=>f.kind===kind&&f.refId===refId)
  .sort((a,b)=>(b.at||'').localeCompare(a.at||''));}

async function attAdd(kind,refId,fileList){
  const files=[...fileList];
  for(const file of files){
    if(file.size>MAXFILE){toast('הקובץ "'+file.name+'" גדול מדי (מעל 12MB)');continue;}
    try{
      toast('מעלה את '+file.name+'…');
      let data=await readDataURL(file);
      if(/^image\//.test(file.type))data=await shrinkImage(data,1700,0.72);
      const meta={id:uid(),name:file.name,type:file.type||'application/octet-stream',
        size:Math.round(data.length*0.75),kind,refId,by:me.name,at:new Date().toISOString(),chunks:0};
      if(_live&&FSM&&FSdb){
        const parts=[];for(let i=0;i<data.length;i+=CHUNK)parts.push(data.slice(i,i+CHUNK));
        for(let i=0;i<parts.length;i++)
          await FSM.setDoc(FSM.doc(FSdb,PFX+'filechunks',meta.id+'_'+i),{d:parts[i]});
        meta.chunks=parts.length;
      } else {
        await idbPut(meta.id,data);
      }
      db.files=db.files||[];db.files.push(meta);
      logAct('צורף קובץ '+file.name+' ל'+(ATT_KINDS[kind]||kind));
      save();
      toast(file.name+' צורף');
    }catch(e){toast('לא הצלחתי לצרף את '+file.name);}
  }
  attPaint(kind,refId);
}
async function attData(meta){
  if(meta.chunks){
    if(!FSM||!FSdb)return null;
    let s='';
    for(let i=0;i<meta.chunks;i++){
      const d=await FSM.getDoc(FSM.doc(FSdb,PFX+'filechunks',meta.id+'_'+i));
      s+=((d.data&&d.data())||{}).d||'';
    }
    return s||null;
  }
  return await idbGet(meta.id);
}
async function attOpen(fid){
  const m=byId(db.files,fid);if(!m)return;
  toast('פותח…');
  const data=await attData(m);
  if(!data)return toast('הקובץ לא נמצא — ייתכן שהועלה ממחשב אחר בלי סנכרון');
  const w=window.open('','_blank');
  if(!w)return toast('הדפדפן חסם את החלון — לאשר חלונות קופצים');
  if(/^image\//.test(m.type))
    w.document.write('<title>'+esc(m.name)+'</title><body style="margin:0;background:#101a2b;display:grid;place-items:center"><img src="'+data+'" style="max-width:100%;max-height:100vh"></body>');
  else w.location.href=data;
}
async function attDownload(fid){
  const m=byId(db.files,fid);if(!m)return;
  const data=await attData(m);
  if(!data)return toast('הקובץ לא נמצא');
  if(DL&&DL.save){DL.save({filename:m.name,data}).then(()=>toast('נשמר'),()=>{});return;}
  const a=document.createElement('a');a.href=data;a.download=m.name;a.click();
}
async function attDel(fid,kind,refId){
  const m=byId(db.files,fid);if(!m)return;
  if(!confirm('למחוק את "'+m.name+'"?'))return;
  if(m.chunks&&FSM&&FSdb){for(let i=0;i<m.chunks;i++)FSM.deleteDoc(FSM.doc(FSdb,PFX+'filechunks',m.id+'_'+i));}
  else await idbDel(m.id);
  db.files=db.files.filter(f=>f.id!==fid);
  logAct('נמחק קובץ מצורף '+m.name);save();attPaint(kind,refId);
}
/* פאנל הצרופות שמוטמע בתוך הטפסים */
function attPanel(kind,refId,label){

function attCount(kind,refId){const n=attOf(kind,refId).length;

/* =========================================================================
   גרירת קבצים
   כל מקום שמקבל קובץ מקבל גם גרירה וגם בחירה רגילה.
   ========================================================================= */
window._DZ={};
function dropZone(id,label,accept,handler){
  window._DZ[id]={accept,handler};
  return `<div class="dz" id="${id}" ondragover="dzOver(event,'${id}')" ondragleave="dzLeave('${id}')"
    ondrop="dzDrop(event,'${id}')" onclick="dzPick('${id}')" role="button" tabindex="0"
    onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();dzPick('${id}')}">
    <div class="ic">⇪</div><b>${esc(label)}</b><span>או לוחצים כאן לבחירת קובץ</span></div>`;
}
function dzOver(e,id){e.preventDefault();e.stopPropagation();const el=document.getElementById(id);if(el)el.classList.add('over');}
function dzLeave(id){const el=document.getElementById(id);if(el)el.classList.remove('over');}
function dzRun(id,files){
  const z=window._DZ[id];if(!z||!files||!files.length)return;
  window.FILES=files;
  try{eval(z.handler.replace('FILES','window.FILES'));}catch(e){toast('שגיאה בקליטת הקובץ');}
}
function dzDrop(e,id){
  e.preventDefault();e.stopPropagation();dzLeave(id);
  const f=e.dataTransfer&&e.dataTransfer.files;
  if(f&&f.length)dzRun(id,f);
}
function dzPick(id){
  const z=window._DZ[id];if(!z)return;
  const inp=document.getElementById('filein');
  inp.accept=z.accept||'';inp.multiple=true;inp.value='';
  inp.onchange=e=>{if(e.target.files&&e.target.files.length)dzRun(id,e.target.files);};
  inp.click();
}

/* =========================================================================
   בדיקת תקינות טקסט
   רשומות שנקלטו פעם מקובץ בקידוד שגוי מכילות תווי ג'יבריש. את הטקסט המקורי
   אי אפשר לשחזר — הבייטים אבדו בקריאה — ולכן מוצאים אותן, מוחקים ומייבאים מחדש.
   ========================================================================= */
const SCAN_COLLS=[['clients','לקוחות','biz'],['suppliers','ספקים','buy'],['subs','קבלני משנה','money'],
  ['projects','פרויקטים','biz'],['contracts','חוזים','biz'],['stock','פריטי מלאי','stock'],
  ['plists','מחירונים','buy'],['quotes','הצעות מחיר','biz'],['tasks','משימות','biz']];
function recBroken(o){
  const seen=new Set();
  const walk=v=>{
    if(typeof v==='string')return brokenText(v);
    if(Array.isArray(v))return v.some(walk);
    if(v&&typeof v==='object'){if(seen.has(v))return false;seen.add(v);return Object.keys(v).some(k=>walk(v[k]));}
    return false;};
  return walk(o);
}
function scanBroken(){
  const out=[];
  SCAN_COLLS.forEach(([k,label])=>(db[k]||[]).forEach(r=>{
    if(recBroken(r))out.push({coll:k,label,id:r.id,name:r.name||r.num||r.desc||r.title||'—',
      items:Array.isArray(r.items)?r.items.length:(Array.isArray(r.boq)?r.boq.length:0)});}));
  return out;
}
function dataCheck(){
  const bad=scanBroken();
  openModal('בדיקת תקינות נתונים',
    bad.length?`<div class="alert err">נמצאו ${bad.length} רשומות שהטקסט בהן משובש — הן נקלטו בעבר מקובץ שנקרא בקידוד שגוי.</div>
     <div class="alert info">את השמות המקוריים אי אפשר לשחזר מתוך המערכת (המידע אבד כבר בקריאת הקובץ). הדרך הנכונה: למחוק אותן כאן, ואז לייבא מחדש את אותו קובץ — הגרסה הזאת כבר קוראת אותו נכון וחוסמת ייבוא משובש.</div>
     ${T([{l:'סוג',f:r=>esc(r.label)},
          {l:'מה רשום עכשיו',f:r=>`<span style="color:var(--red)">${esc(String(r.name).slice(0,40))}</span>`},
          {l:'פריטים',f:r=>r.items||'—',cls:'num'}],bad,'','')}`
    :`<div class="alert ok">כל הטקסט במערכת תקין. לא נמצאו רשומות משובשות.</div>`,
    bad.length&&me.role==='admin'
      ?`<button class="btn dan" onclick="cleanBroken()">מחיקת ${bad.length} הרשומות המשובשות</button>
        <button class="btn sec" onclick="closeModal()">סגירה</button>`
      :`<button class="btn sec" onclick="closeModal()">סגירה</button>`,true);
}
function cleanBroken(){
  const bad=scanBroken();
  if(!bad.length)return;
  if(!confirm('למחוק '+bad.length+' רשומות משובשות?\nרשומות שכבר מקושרות למסמכים יישארו ויוצגו בנפרד.\nהפעולה לא ניתנת לביטול — מומלץ להוריד גיבוי קודם.'))return;
  /* מוחקים בסבבים: מחירון משובש חוסם את הספק המשובש שלו, אחרי שהוא נמחק הספק משתחרר */
  let del=0,left=bad.slice(),pass=0;
  while(left.length&&pass++<6){
    const still=[];
    left.forEach(r=>{
      const R=DEL_RULES[r.coll];
      if(R&&(R.blocks(r.id)||[]).some(b=>b[0]>0)){still.push(r);return;}
      if(R)delDo(r.coll,r.id); else db[r.coll]=(db[r.coll]||[]).filter(x=>x.id!==r.id);
      del++;});
    if(still.length===left.length)break;   /* אין יותר התקדמות */
    left=still;
  }
  const kept=left;
  logAct('ניקוי נתונים — נמחקו '+del+' רשומות עם טקסט משובש');
  save();closeModalSaved();render();
  toast(del+' נמחקו'+(kept.length?' · '+kept.length+' נשארו כי הן מקושרות למסמכים':''));
}

/* =========================================================================
   בחירה מרובה ברשימות — לקוחות, ספקים, קבלנים
   מסמנים כמה, ואז: עריכה אחד אחרי השני, ייצוא הנבחרים או מחיקה.
   ========================================================================= */
window._sel={};window._selVis={};window._batch=null;
function selSet(kind){return (window._sel[kind]=window._sel[kind]||{});}
function selIds(kind){const S=selSet(kind);return (db[kind]||[]).filter(x=>S[x.id]).map(x=>x.id);}
function selTog(kind,id,on){const S=selSet(kind);if(on)S[id]=1;else delete S[id];render();}
function selAll(kind,on){const S=selSet(kind);(window._selVis[kind]||[]).forEach(id=>{if(on)S[id]=1;else delete S[id];});render();}
function selClear(kind){window._sel[kind]={};render();}
/* עמודת הסימון לטבלה — הכותרת היא "בחר הכל" על מה שמוצג */
function selCol(kind,visible){
  window._selVis[kind]=visible.map(x=>x.id);
  const S=selSet(kind);
  /* מה שלא מוצג (סונן החוצה) יוצא מהבחירה — כדי שלא ימחקו/יערכו רשומות שלא רואים */
  Object.keys(S).forEach(id=>{if(!window._selVis[kind].includes(id))delete S[id];});
  const all=visible.length>0&&visible.every(x=>S[x.id]);
  return {h:`<input type="checkbox" title="בחירת כל המוצגים" ${all?'checked':''} onchange="selAll('${kind}',this.checked)">`,thc:'selc',cls:'selc',
    f:x=>`<input type="checkbox" ${S[x.id]?'checked':''} onchange="selTog('${kind}','${x.id}',this.checked)">`};
}
function selBar(kind){
  const ids=selIds(kind);if(!ids.length)return '';
  return `<div class="selbar"><span class="n">${ids.length} נבחרו</span>
    <button class="btn sm" onclick="batchEdit('${kind}')">עריכה אחד אחרי השני</button>
    <button class="btn sm sec" onclick="impExportIds('${kind}',selIds('${kind}'))">ייצוא הנבחרים</button>
    ${me.role==='admin'?`<button class="btn sm dan" onclick="selDelete('${kind}')">מחיקת הנבחרים</button>`:''}
    <button class="btn sm sec" onclick="selClear('${kind}')">ניקוי בחירה</button></div>`;
}
const BATCH_FORMS={clients:id=>cliForm(id),suppliers:id=>supForm(id),subs:id=>subForm(id)};
function batchEdit(kind){
  const ids=selIds(kind);if(!ids.length)return;
  window._batch={kind,ids,i:0};
  batchOpen();
}
function batchOpen(){
  const B=window._batch;if(!B)return;
  while(B.i<B.ids.length&&!byId(db[B.kind]||[],B.ids[B.i]))B.i++;   /* רשומה שנמחקה בינתיים — מדלגים */
  if(B.i>=B.ids.length){window._batch=null;window._sel[B.kind]={};render();return toast('כל הרשומות שנבחרו נערכו');}
  const f=BATCH_FORMS[B.kind];if(!f){window._batch=null;return;}
  f(B.ids[B.i]);
}
function batchOn(kind,id){const B=window._batch;return !!(B&&B.kind===kind&&B.ids[B.i]===id);}
function batchBtns(kind,id){
  if(!batchOn(kind,id))return '';
  const B=window._batch;
  return `<span class="hint" style="align-self:center;margin:0 6px">רשומה ${B.i+1} מתוך ${B.ids.length}</span>
    <button class="btn sec" onclick="batchSkip()">דילוג לבא</button>`;
}
function batchSkip(){const B=window._batch;if(!B)return;window._mDirty=false;B.i++;closeModal(true);batchOpen();}
/* אחרי שמירה מוצלחת — ממשיכים לרשומה הבאה */
function batchAfter(kind,id){
  const B=window._batch;if(!B||B.kind!==kind||B.ids[B.i]!==id)return;
  B.i++;setTimeout(batchOpen,120);
}
function selDelete(kind){
  const ids=selIds(kind);if(!ids.length)return;
  if(me.role!=='admin')return toast('רק מנהל יכול למחוק רשומות');
  const R=DEL_RULES[kind];if(!R)return;
  const blocked=[],ok=[];
  ids.forEach(id=>{const rec=byId(db[R.coll],id);if(!rec)return;
    const b=(R.blocks(id)||[]).filter(x=>x[0]>0);
    (b.length?blocked:ok).push(rec);});
  if(!ok.length)return toast('כל הרשומות שנבחרו מקושרות למסמכים ולא ניתנות למחיקה');
  const names=ok.slice(0,8).map(r=>'• '+(r.name||r.num||'')).join('\n')+(ok.length>8?'\n… ועוד '+(ok.length-8):'');
  if(!confirm('למחוק '+ok.length+' רשומות?\n'+names+(blocked.length?'\n\n'+blocked.length+' רשומות מקושרות למסמכים ויישארו: '+blocked.map(r=>r.name).slice(0,5).join(', '):'')+'\n\nהפעולה לא ניתנת לביטול.'))return;
  ok.forEach(rec=>delDo(kind,rec.id));
  window._sel[kind]={};
  save();render();
  toast(ok.length+' נמחקו'+(blocked.length?' · '+blocked.length+' נשארו כי הן מקושרות למסמכים':''));
}

    [db.dns.filter(d=>d.poId===id).length,'תעודות משלוח'],

  stock:{coll:'stock',what:'הפריט',att:'stock',blocks:id=>[
    [db.moves.filter(m=>m.itemId===id).length,'תנועות מלאי']]},
  users:{coll:'users',what:'המשתמש',att:'user',blocks:()=>[]}

function delRec(kind,id,after){
  const R=DEL_RULES[kind];if(!R)return;
  const rec=byId(db[R.coll],id);if(!rec)return;
  if(me.role!=='admin'&&kind!=='dns')return toast('רק מנהל יכול למחוק רשומות');
  const blocked=(R.blocks(id)||[]).filter(b=>b[0]>0);
  if(blocked.length){
    return openModal('אי אפשר למחוק את '+R.what,
      `<div class="alert err">${esc(rec.name||rec.num||'')} מקושר למסמכים אחרים במערכת, ומחיקה תשאיר אותם בלי מקור.</div>
       <ul style="line-height:1.9;padding-inline-start:20px">${blocked.map(b=>`<li>${b[0]} ${esc(b[1])}</li>`).join('')}</ul>
       <div class="hint">אפשר למחוק קודם את המסמכים האלה, או להשאיר את הרשומה ולסמן אותה כלא פעילה בהערות.</div>`,
      `<button class="btn sec" onclick="closeModal()">סגירה</button>`);
  }
  if(kind==='users'){
    if(id===me.id)return toast('אי אפשר למחוק את המשתמש שאיתו נכנסת');
    if(db.users.filter(u=>u.role==='admin'&&u.active!==false).length<2&&rec.role==='admin')
      return toast('צריך להשאיר לפחות מנהל אחד פעיל');
  }
  if(rec.date&&periodLocked(rec.date))
    return toast('המסמך בתאריך '+dt(rec.date)+' נמצא בתקופה נעולה ולא ניתן למחיקה');
  if(!confirm('למחוק את '+R.what+' "'+(rec.name||rec.num||'')+'"? הפעולה לא ניתנת לביטול.'))return;
  const inBatch=batchOn(kind,id);
  delDo(kind,id);
  save();closeModalSaved();render();toast('נמחק');
  if(after)after();
  if(inBatch)batchAfter(kind,id);
}
/* המחיקה עצמה, בלי שאלות — משמש גם למחיקה מרובה */
function delDo(kind,id){
  const R=DEL_RULES[kind];const rec=byId(db[R.coll],id);if(!rec)return;
  /* תעודת משלוח שנקלטה למלאי — מחזירים את הכמויות */
  if(kind==='dns'&&rec.toStock)(rec.lines||[]).forEach(l=>{
    const it=db.stock.find(s=>s.id===l.itemId||(l.sku&&s.sku===l.sku));
    if(it)it.qty=(Number(it.qty)||0)-(Number(l.qty)||0);
  });
  if(kind==='pinv')db.payments=(db.payments||[]).filter(p=>p.invId!==id);
  (attOf(R.att,id)||[]).forEach(f=>{
    if(f.chunks&&FSM&&FSdb)for(let i=0;i<f.chunks;i++)FSM.deleteDoc(FSM.doc(FSdb,PFX+'filechunks',f.id+'_'+i));
    else idbDel(f.id);
  });
  db.files=(db.files||[]).filter(f=>!(f.kind===R.att&&f.refId===id));
  db[R.coll]=db[R.coll].filter(x=>x.id!==id);
  logAct('נמחק/ה '+R.what+' '+(rec.name||rec.num||''));
}
function delBtn(kind,id){
  if(!id)return '';
  if(me.role!=='admin'&&kind!=='dns')return '';
  return `<button class="btn dan" onclick="delRec('${kind}','${id}')">מחיקה</button>`;
}

/* =========================================================================
   ייבוא וייצוא אקסל — לכל הרשימות
   קורא xlsx ו-csv, מציג תצוגה מקדימה לפני הקליטה, ומעדכן רשומות קיימות
   לפי שם או מק"ט במקום ליצור כפילויות.
   ========================================================================= */
let _XLSX=null;
async function xlsxLib(){
  if(_XLSX)return _XLSX;
  if(window.XLSX)return (_XLSX=window.XLSX);
  const srcs=window.__XLSX_URL__?[window.__XLSX_URL__]:[
    'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',
    'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js'];
  for(const src of srcs){
    try{
      await new Promise((res,rej)=>{
        const s=document.createElement('script');
        s.src=src;s.onload=res;s.onerror=()=>rej(new Error('no-lib'));
        document.head.appendChild(s);
        setTimeout(()=>rej(new Error('no-lib')),12000);
      });
      if(window.XLSX)return (_XLSX=window.XLSX);
    }catch(e){/* ננסה את המקור הבא */}
  }
  throw new Error('no-lib');
}
/* בורר קובץ אחיד לכל הייבואים — מקבל xlsx וגם csv בכל קידוד */
function pickSheet(cb){
  const f=document.getElementById('filein');
  f.accept='.xlsx,.xls,.csv,.txt,.tsv';f.value='';f.multiple=false;
  f.onchange=async e=>{
    const file=e.target.files[0];if(!file)return;
    try{
      toast('קורא את הקובץ…');
      const rows=await sheetRows(file);
      if(rows.length<2)return toast('הקובץ ריק או מכיל רק כותרות');
      cb(rows);
    }catch(err){
      toast(err&&err.message==='no-lib'
        ? 'לא הצלחתי לטעון את קורא האקסל — לשמור את הקובץ כ-CSV ולנסות שוב'
        : 'לא הצלחתי לקרוא את הקובץ');
    }
  };
  f.click();
}
/* קורא את הקובץ ומחזיר את כל הגיליונות — לא רק הראשון.
   חשוב: הסוג נקבע לפי הבייטים הראשונים ולא לפי הסיומת. הרבה מערכות בישראל
   מייצאות "אקסל" שהוא בעצם טבלת HTML או CSV בקידוד ווינדוס עם סיומת xls/xlsx,
   וקריאה שלו כקובץ אקסל אמיתי הופכת את העברית לג'יבריש. */
function fileKind(b){
  if(b.length>3&&b[0]===0x50&&b[1]===0x4B&&(b[2]===0x03||b[2]===0x05||b[2]===0x07))return 'zip';   /* xlsx / xlsm */
  if(b.length>7&&b[0]===0xD0&&b[1]===0xCF&&b[2]===0x11&&b[3]===0xE0)return 'biff';                 /* xls ישן אמיתי */
  if(b.length>1&&b[0]===0x09&&(b[1]===0x00||b[1]===0x02||b[1]===0x04))return 'biff';               /* BIFF2-4 */
  return 'text';
}
function looksHTML(t){return /<\s*(table|html|tr|td|body)[\s>]/i.test(t.slice(0,6000));}
function sheetsOf(X,wb){
  return wb.SheetNames.map(n=>({name:n,
    rows:X.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:false,defval:''})
      .filter(r=>r.some(c=>String(c).trim()!==''))}));
}
async function sheetBook(file,force){
  const buf=await file.arrayBuffer();
  const b=new Uint8Array(buf);
  const kind=fileKind(b);
  if(kind==='text'){
    /* טקסט — מפענחים בעצמנו (כולל windows-1255) ורק אז מוסרים הלאה */
    const txt=decodeSmart(buf,force).replace(/^\uFEFF/,'');
    if(looksHTML(txt)){
      const X=await xlsxLib();
      return sheetsOf(X,X.read(txt,{type:'string'}));
    }
    return [{name:'הקובץ',rows:parseCSV(txt)}];
  }
  const X=await xlsxLib();
  const opt={type:'array',cellDates:true};
  if(kind==='biff')opt.codepage=1255;   /* אקסל 97-2003 בעברית */
  return sheetsOf(X,X.read(buf,opt));
}
/* טקסט שנשבר בפענוח — תווי החלפה, חצאי-תווים, או מבול סימנים לטיניים
   במקום עברית. זה בדיוק מה שהופך אחר כך לריבועים ולסימני שאלה בענן. */
function brokenText(t){
  t=String(t==null?'':t);
  if(!t)return false;
  if(/[\uFFFD\uD800-\uDFFF]/.test(t))return true;
  const weird=(t.match(/[\u00C0-\u00FF\u0100-\u024F\u3000-\uFAFF]/g)||[]).length;
  return weird>0&&weird/t.length>0.3;
}
function brokenRows(rows){
  let bad=0,tot=0;
  (rows||[]).slice(0,40).forEach(r=>(r||[]).forEach(c=>{
    const v=String(c==null?'':c).trim();if(!v)return;tot++;if(brokenText(v))bad++;}));
  return tot?bad/tot:0;
}
/* רשת ביטחון אחרונה לפני שמירה — חצי-תו בודד הופך ל-U+FFFD בענן */
function cleanText(v){
  return (typeof v==='string')?v.replace(/[\uD800-\uDBFF](?![\uDC00-\uDFFF])|(?:[^\uD800-\uDBFF]|^)[\uDC00-\uDFFF]/g,m=>m.length>1?m[0]:''):v;
}
/* הגיליון שנראה כמו טבלת נתונים אמיתית ולא דף הוראות */
function bestSheet(book){
  let bi=0,bs=-1;
  book.forEach((s,i)=>{
    const rows=s.rows||[];
    const cols=Math.max(0,...rows.map(r=>r.filter(c=>String(c).trim()!=='').length));
    const score=rows.length*2+cols*3;
    if(score>bs){bs=score;bi=i;}
  });
  return bi;
}
/* מוריד עמודות ריקות בקצוות ומוצא את שורת הכותרות האמיתית */
function trimCols(rows){
  if(!rows.length)return rows;
  const w=Math.max(...rows.map(r=>r.length));
  const keep=[];
  for(let c=0;c<w;c++)if(rows.some(r=>String(r[c]==null?'':r[c]).trim()!==''))keep.push(c);
  return rows.map(r=>keep.map(c=>r[c]==null?'':r[c]));
}
function findHeaderRow(rows,cols){
  const filled=r=>r.filter(c=>String(c).trim()!=='').length;
  let best=0,bestScore=-1;
  const lim=Math.min(rows.length,12);
  for(let i=0;i<lim;i++){
    const r=rows[i]||[];
    if(filled(r)<2)continue;
    let score=0;
    if(cols&&cols.length){
      /* כמה מהעמודות שאנחנו מחפשים מזוהות בשורה הזאת */
      cols.forEach(c=>{let m=0;r.forEach(h=>{m=Math.max(m,hdrScore(c,h));});score+=m;});
    }
    /* שורת כותרות היא טקסט, לא מספרים */
    const txt=r.filter(c=>{const s=String(c).trim();return s&&!/^[\d.,₪%\-\/]+$/.test(s);}).length;
    score+=txt*8;
    if(rows[i+1]&&filled(rows[i+1])>=2)score+=20;
    if(score>bestScore){bestScore=score;best=i;}
  }
  return best;
}
/* שמות עמודות נפוצים — כדי להתאים לבד גם כשהכותרת נכתבה אחרת */

function hdrNorm(s){
  return String(s==null?'':s).toLowerCase()
    .replace(/["'`״׳.\-_()\[\]\/\\]/g,'').replace(/\s+/g,'').replace(/%/g,'').trim();
}
function hdrKey(label){
  const n=hdrNorm(label);if(!n)return '';
  /* קודם התאמה מדויקת לשם נרדף, ורק אחר כך הכלה — כדי ש"מחיר ליחידה" לא ייחשב "יחידה" */
  for(const k in HDR_SYN)if(HDR_SYN[k].some(x=>n===x))return k;
  let best='',bl=0;
  for(const k in HDR_SYN)HDR_SYN[k].forEach(x=>{
    if(x.length>bl&&x.length>=2&&(n.includes(x)||(x.length>=3&&x.includes(n)))){best=k;bl=x.length;}});
  return best||n;
}
/* ניקוד התאמה בין כותרת בקובץ לעמודה שהמערכת מצפה לה */
function hdrScore(target,found){
  const t=hdrNorm(target), f=hdrNorm(found);
  if(!f||!t)return 0;
  if(t===f)return 100;
  const tk=hdrKey(target), syn=HDR_SYN[tk]||[];
  if(syn.includes(f))return 95;
  const fk=hdrKey(found);
  if(tk&&tk===fk)return 90;
  if(syn.some(x=>x.length>=3&&f.includes(x)))return 75;
  if(t.includes(f)||f.includes(t))return 70;
  return 0;
}
/* התאמה גלובלית — הזוגות הבטוחים ביותר נתפסים קודם, לא לפי סדר העמודות */
function autoMap(headers,cols){
  const pairs=[];
  cols.forEach((c,ci)=>headers.forEach((h,hi)=>{const s=hdrScore(c,h);if(s>40)pairs.push({ci,hi,s});}));
  pairs.sort((a,b)=>b.s-a.s||a.ci-b.ci);
  const map=cols.map(()=>-1),used={};
  pairs.forEach(x=>{if(map[x.ci]>=0||used[x.hi])return;map[x.ci]=x.hi;used[x.hi]=1;});
  return map;
}

}

/* הגדרת כל ייבוא: עמודות, מפתח לזיהוי רשומה קיימת, ובנייה של הרשומה */
/* אקסל בעברית כותב מספרים עם פסיק אלפים, סימן שקל ואחוזים,
   ותאריכים בפורמט יום/חודש/שנה. כאן מנרמלים הכול לפני הקליטה. */
function numOf(v){
  if(v==null||v==='')return 0;
  if(typeof v==='number')return isFinite(v)?v:0;
  let s=String(v).trim();
  const neg=/^\(.*\)$/.test(s)||/^-/.test(s);
  s=s.replace(/[₪$€%]/g,'').replace(/[\s '](?=\d)/g,'').replace(/,/g,'').replace(/[()]/g,'').trim();
  const m=s.match(/-?\d+(\.\d+)?/);
  if(!m)return 0;
  const n=Math.abs(parseFloat(m[0]));
  return isFinite(n)?(neg?-n:n):0;
}
function dateOf(v){
  if(!v&&v!==0)return '';
  if(v instanceof Date&&!isNaN(v))return iso(v);
  const s=String(v).trim();
  if(!s)return '';
  if(/^\d{4}-\d{2}-\d{2}/.test(s))return s.slice(0,10);
  /* מספר סידורי של אקסל */
  if(/^\d{5}(\.\d+)?$/.test(s)){
    const d=new Date(Date.UTC(1899,11,30)+Number(s)*86400000);
    return isNaN(d)?'':iso(d);
  }
  const m=s.match(/^(\d{1,2})[./-](\d{1,2})[./-](\d{2,4})/);
  if(m){
    let[,dd,mm,yy]=m;
    yy=String(yy).length===2?'20'+yy:yy;
    if(Number(dd)>12&&Number(mm)<=12){/* יום/חודש — כרגיל בישראל */}
    else if(Number(mm)>12){const t=dd;dd=mm;mm=t;}
    const d=new Date(Number(yy),Number(mm)-1,Number(dd));
    return isNaN(d)?'':iso(d);
  }
  const d=new Date(s);
  return isNaN(d)?'':iso(d);
}

  const rows=trimCols(S.book[S.si].rows||[]);
  S.rows=rows;
  S.hdr=findHeaderRow(rows,I.cols);
  S.map=autoMap(rows[S.hdr]||[],I.cols);
  impMapUI();
}

          ${S.rows.slice(0,Math.min(10,S.rows.length)).map((r,i)=>

function impCount(){
  const S=window._imp, I=IMPORTS[S.kind];
  const el=document.getElementById('impCount');if(!el)return;
  if(I.run){
    const rows=impMapped();const ok=rows.filter(r=>I.valid?I.valid(r):true).length;
    el.innerHTML=`<div class="match">
      <div class="m ok"><div class="l">שורות שייקלטו</div><div class="v">${ok}</div></div>
      <div class="m ${rows.length-ok?'bad':''}"><div class="l">שורות שידולגו</div><div class="v">${rows.length-ok}</div></div>
      <div class="m"><div class="l">סה״כ שורות</div><div class="v">${rows.length}</div></div></div>`;
    return;
  }
  const list=db[I.coll]||[];
  let add=0,upd=0,skip=0;
  impMapped().forEach(r=>{
    if(!String(r[0]||'').trim()&&!String(r[1]||'').trim()){skip++;return;}
    const ex=I.match?list.find(x=>I.match(r,x)):list.find(x=>x.name===String(r[0]).trim());
    ex?upd++:add++;
  });
  el.innerHTML=`<div class="match">
    <div class="m ok"><div class="l">רשומות חדשות</div><div class="v">${add}</div></div>
    <div class="m"><div class="l">יעודכנו</div><div class="v">${upd}</div></div>
    <div class="m ${skip?'bad':''}"><div class="l">שורות שידולגו</div><div class="v">${skip}</div></div>
  </div>`;
}
/* השורות כפי שהן ייכנסו — לפי המיפוי שנבחר */
function impMapped(){
  const S=window._imp;
  return S.rows.slice(S.hdr+1).map(r=>S.map.map(ix=>ix>=0?r[ix]:''));
}
function impRun(){
  const S=window._imp, I=IMPORTS[S.kind];
  if(brokenRows(S.rows)>0.25)return toast('הטקסט בקובץ משובש — לא נקלט. לשמור את הקובץ כ-CSV UTF-8 ולנסות שוב');
  if(I.run){
    const rows=impMapped().map(raw=>raw.map(v=>(typeof v==='string')?v.trim():v));
    return I.run(rows,S.ctx||{});
  }
  const list=db[I.coll]=db[I.coll]||[];
  let add=0,upd=0;
  impMapped().forEach(raw=>{
    const r=raw.map(v=>(typeof v==='string')?v.trim():v);
    if(!String(r[0]||'').trim()&&!String(r[1]||'').trim())return;
    const ex=I.match?list.find(x=>I.match(r,x)):list.find(x=>x.name===String(r[0]).trim());
    const o=I.build(r,ex);
    if(ex){Object.assign(ex,o);upd++;}else{list.push(o);add++;}
  });
  logAct('ייבוא '+I.title+' מאקסל — '+add+' חדשים, '+upd+' עודכנו');
  save();closeModalSaved();render();
  toast(add+' נוספו · '+upd+' עודכנו');
}
/* ייצוא של רשומות נבחרות בלבד */
function impExportIds(kind,ids){
  const I=IMPORTS[kind];if(!I)return;
  const all=db[I.coll]||[];
  const keep=all.filter(o=>ids.includes(o.id));
  db[I.coll]=keep;
  try{impExport(kind);}finally{db[I.coll]=all;}
}
/* ייצוא אחיד לכל רשימה — נפתח באקסל */
function impExport(kind){
  const I=IMPORTS[kind];
  const rows=[I.cols];
  (db[I.coll]||[]).forEach(o=>{
    if(kind==='clients'){const c=mainContact(o);rows.push([o.name,o.taxId,o.terms,o.address,c.name,c.role,c.phone,c.email,o.notes]);}
    else if(kind==='suppliers'){const c=mainContact(o);rows.push([o.name,o.taxId,o.cat,o.terms,o.disc,c.name,c.role,c.phone,c.email,o.address,o.bank]);}
    else if(kind==='subs'){const c=mainContact(o);rows.push([o.name,o.taxId,o.trade,o.terms,o.insPct,o.retPct,c.name,c.role,c.phone,c.email]);}
    else if(kind==='projects')rows.push([o.name,client(o.clientId).name,o.code,o.address,o.status,o.manager,o.center,o.start,o.end]);
    else if(kind==='stock')rows.push([o.sku,o.desc,o.unit,o.qty,o.cost,o.loc,o.min]);
    else if(kind==='tasks'){const u=byId(db.users,o.owner);rows.push([o.title,project(o.projectId).name,o.phase,u?u.name:'',o.start,o.due,o.status,o.pct]);}
  });
  csvDown(I.title,rows);
}
/* כפתורי ייבוא/ייצוא אחידים לכותרת כל מסך */
function ioButtons(kind){
  return `<button class="btn sec" onclick="impOpen('${kind}')">ייבוא מאקסל</button>

/* =========================================================================
   ניהול משתמשים אישיים
   כל עובד מקבל חשבון עם הדוא״ל שלו וקוד אישי. הכניסה עצמה נעשית מול
   Firebase, וכך אפשר לעבוד מכל מחשב, והפעולות נרשמות על שם מי שביצע.
   ========================================================================= */
function normMail(m){return String(m||'').trim().toLowerCase();}
async function memberWrite(u){
  if(!_live||!FSM||!FSdb||!u.email)return;
  try{
    await FSM.setDoc(FSM.doc(FSdb,PFX+'members',normMail(u.email)),
      {email:normMail(u.email),name:u.name||'',role:u.role||'office',userId:u.id,active:u.active!==false});
  }catch(e){}
}
async function memberRemove(email){
  if(!_live||!FSM||!FSdb||!email)return;
  try{await FSM.deleteDoc(FSM.doc(FSdb,PFX+'members',normMail(email)));}catch(e){}
}
/* יצירת חשבון הכניסה — נעשית על עותק צדדי של החיבור כדי לא לנתק את המנהל */
async function authCreate(email,code){
  const cfg=fbCfg();
  if(!cfg||!APPM||!AUTHM)throw new Error('no-connection');
  const sec=APPM.initializeApp(cfg,'mk-'+Date.now());
  try{
    const sa=AUTHM.getAuth(sec);
    await AUTHM.createUserWithEmailAndPassword(sa,normMail(email),code);
    await AUTHM.signOut(sa);
  } finally {
    try{await APPM.deleteApp(sec);}catch(e){}
  }
}
function userAccount(id){
  const u=byId(db.users,id);if(!u)return;
  if(!u.email)return toast('צריך קודם למלא דוא״ל בכרטיס המשתמש');
  openModal('חשבון כניסה — '+u.name,
    `<div class="alert info">החשבון מאפשר ל${esc(u.name)} להיכנס מכל מחשב עם הדוא״ל שלו והקוד האישי. הקוד חייב להיות באורך 6 תווים לפחות.</div>
     ${F([{k:'acMail',l:'דוא״ל',ro:true,w:2},{k:'acCode',l:'קוד אישי ראשוני',req:true}],
        {acMail:u.email,acCode:u.code&&u.code.length>=6?u.code:''},'g3')}
     <div class="hint">אחרי היצירה כדאי שהעובד ישנה את הקוד דרך "שכחתי את הקוד" במסך הכניסה.</div>`,
    `<button class="btn" onclick="userAccountCreate('${id}')">יצירת חשבון כניסה</button>
     <button class="btn sec" onclick="userAccountReset('${id}')">שליחת קישור לאיפוס</button>
     <button class="btn sec" onclick="closeModal()">סגירה</button>`);
}
async function userAccountCreate(id){
  const u=byId(db.users,id);
  const code=fv('acCode').trim();
  if(code.length<6)return toast('הקוד חייב להיות באורך 6 תווים לפחות');
  try{
    toast('יוצר חשבון…');
    await authCreate(u.email,code);
    u.code=code;u.hasAccount=true;
    await memberWrite(u);
    logAct('נוצר חשבון כניסה ל'+u.name+' ('+u.email+')');
    save();closeModalSaved();render();
    toast('החשבון נוצר — אפשר למסור ל'+u.name.split(' ')[0]+' את הדוא״ל והקוד');
  }catch(e){
    const c=(e&&e.code)||'';
    if(/email-already-in-use/.test(c)){
      u.hasAccount=true;await memberWrite(u);save();closeModalSaved();render();
      toast('כבר קיים חשבון לדוא״ל הזה — הוא חובר למשתמש. לשינוי קוד יש לשלוח קישור לאיפוס.');
    }
    else if(/weak-password/.test(c))toast('הקוד קצר או פשוט מדי');
    else if(/invalid-email/.test(c))toast('כתובת הדוא״ל אינה תקינה');
    else if(/operation-not-allowed/.test(c))toast('צריך להפעיל ב-Firebase כניסה עם דוא״ל וסיסמה');
    else toast('יצירת החשבון נכשלה');
  }
}
function userAccountReset(id){
  const u=byId(db.users,id);
  if(!AUTH||!AUTHM)return toast('אין חיבור לשרת');
  AUTHM.sendPasswordResetEmail(AUTH,normMail(u.email))
    .then(()=>{logAct('נשלח איפוס קוד ל'+u.name);save();toast('נשלח מייל ל'+u.email);})
    .catch(()=>toast('לא הצלחתי לשלוח — לבדוק שהחשבון קיים'));
}
/* מעבר לכניסה אישית — אחרי שכל העובדים קיבלו חשבון */

  const withAcc=db.users.filter(u=>u.email&&u.hasAccount&&u.active!==false);
  const without=db.users.filter(u=>u.active!==false&&!(u.email&&u.hasAccount));

     </div>
     <div class="alert info">אחרי המעבר, הכניסה למערכת תהיה עם דוא״ל וקוד אישי במקום קוד בלבד. מי שאין לו חשבון לא יוכל להיכנס.</div>
     <ol style="line-height:2;padding-inline-start:20px">
       <li>לוודא שכל עובד קיבל חשבון כניסה (הכפתור "חשבון כניסה" בשורה שלו).</li>
       <li>להעביר את המערכת למצב כניסה אישית — הכפתור למטה.</li>
       <li>רק אז להדק את כללי הגישה ב-Firestore. הכללים מוכנים להעתקה בכפתור "כללי הגישה".</li>
     </ol>`,
    `${db.settings.authMode==='users'
      ? `<button class="btn sec" onclick="authModeSet('code')">חזרה לכניסה בקוד בלבד</button>`
      : `<button class="btn" onclick="authModeSet('users')">מעבר לכניסה אישית</button>`}
     <button class="btn sec" onclick="rulesShow()">כללי הגישה</button>
     <button class="btn sec" onclick="closeModal()">סגירה</button>`,true);
}
function authModeSet(mode){
  if(mode==='users'&&!db.users.some(u=>u.role==='admin'&&u.email&&u.hasAccount))
    return toast('צריך לפחות מנהל אחד עם חשבון כניסה מוכן');
  db.settings.authMode=mode;
  logAct('שינוי אופן הכניסה למערכת ל'+(mode==='users'?'כניסה אישית':'קוד בלבד'));
  save();closeModalSaved();
  toast(mode==='users'?'מהרגע הזה נכנסים עם דוא״ל וקוד. הדף ייטען מחדש.':'חזרה לכניסה בקוד');
  setTimeout(()=>location.reload(),1600);
}

/* =========================================================================
   אבטחה — כללי גישה, App Check, גיבוי בענן ומסך מצב
   ההרשאות נאכפות בשרת ולא רק במסך: גם מי שמנסה לעקוף את הממשק
   מקבל רק את מה שהתפקיד שלו מתיר.
   ========================================================================= */
const RULE_GROUPS={
  staff:['dns','stock','moves','tasks','files','filechunks'],   /* גם שטח — קריאה וכתיבה */
  readStaff:['projects','suppliers','pos','clients'],           /* שטח קורא, משרד כותב */
  office:['contracts','cinv','subs','sinv','pinv','plists','costs','subwork','masters','payments','backups','backupchunks','retrel','quotes','bigchunks'],
  adminOnly:['users']
};
function rulesText(){
  const P=PFX;
  const L=[];
  L.push("rules_version = '2';");
  L.push("service cloud.firestore {");
  L.push("  match /databases/{database}/documents {");
  L.push("");
  L.push("    // מי שנכנס חייב להיות רשום כעובד פעיל");
  L.push("    function mref() {");
  L.push("      return /databases/$(database)/documents/"+P+"members/$(request.auth.token.email);");
  L.push("    }");
  L.push("    function isStaff() {");
  L.push("      return request.auth != null && request.auth.token.email != null");
  L.push("        && exists(mref()) && get(mref()).data.active == true;");
  L.push("    }");
  L.push("    function role() { return get(mref()).data.role; }");
  L.push("    function isAdmin()  { return isStaff() && role() == 'admin'; }");
  L.push("    function isOffice() { return isStaff() && (role() == 'admin' || role() == 'office'); }");
  L.push("");
  L.push("    // רשומת החברות — כל אחד רואה רק את שלו, ורק מנהל משנה");
  L.push("    match /"+P+"members/{email} {");
  L.push("      allow read:  if request.auth != null && request.auth.token.email == email;");
  L.push("      allow write: if isAdmin();");
  L.push("    }");
  L.push("");
  L.push("    // יומן הפעולות — נכתב על ידי כולם, לא נמחק ולא משתנה");
  L.push("    match /"+P+"log/{id} {");
  L.push("      allow read:   if isOffice();");
  L.push("      allow create: if isStaff();");
  L.push("      allow update, delete: if isAdmin();");
  L.push("    }");
  L.push("");
  L.push("    match /"+P+"meta/{id}     { allow read: if isStaff(); allow write: if isOffice(); }");
  L.push("    match /"+P+"presence/{id} { allow read, write: if isStaff(); }");
  L.push("");
  L.push("    // עבודת שטח — תעודות משלוח, מלאי, משימות וקבצים");
  RULE_GROUPS.staff.forEach(c=>L.push("    match /"+P+c+"/{id} { allow read, write: if isStaff(); }"));
  L.push("");
  L.push("    // נתונים שהשטח קורא אבל רק המשרד משנה");
  RULE_GROUPS.readStaff.forEach(c=>L.push("    match /"+P+c+"/{id} { allow read: if isStaff(); allow write: if isOffice(); }"));
  L.push("");
  L.push("    // נתונים כספיים — משרד ומנהל בלבד");
  RULE_GROUPS.office.forEach(c=>L.push("    match /"+P+c+"/{id} { allow read, write: if isOffice(); }"));
  L.push("");
  L.push("    // ניהול משתמשים — מנהל בלבד");
  RULE_GROUPS.adminOnly.forEach(c=>L.push("    match /"+P+c+"/{id} { allow read: if isStaff(); allow write: if isAdmin(); }"));
  L.push("");
  L.push("    // כל השאר חסום");
  L.push("    match /{document=**} { allow read, write: if false; }");
  L.push("  }");
  L.push("}");
  return L.join('\n');
}

/* ---------- גיבוי בענן ---------- */
const BK_KEEP=14;
async function backupToCloud(auto){
  if(!_live||!FSM||!FSdb)return auto?null:toast('אין חיבור לשרת — אפשר להוריד גיבוי לקובץ');
  if(me.role!=='admin'&&!auto)return toast('רק מנהל יכול לגבות');
  try{
    const payload=JSON.stringify(Object.assign({},db,{settings:liveSettings(db.settings)}));
    const id=today();
    const parts=[];for(let i=0;i<payload.length;i+=CHUNK)parts.push(payload.slice(i,i+CHUNK));
    for(let i=0;i<parts.length;i++)
      await FSM.setDoc(FSM.doc(FSdb,PFX+'backupchunks',id+'_'+i),{d:parts[i]});
    await FSM.setDoc(FSM.doc(FSdb,PFX+'backups',id),
      {id,date:id,at:new Date().toISOString(),by:me.name,chunks:parts.length,size:payload.length});
    db.settings.lastBackup=id;
    backupPrune();
    if(!auto)logAct('גיבוי לענן');
    save(true);
    if(!auto)toast('הגיבוי נשמר בענן');
    return id;
  }catch(e){if(!auto)toast('הגיבוי נכשל');return null;}
}
/* שומרים גיבויים של השבועיים האחרונים ומוחקים ישנים */
function backupPrune(){
  const keepFrom=iso(new Date(Date.now()-BK_KEEP*86400000));
  (db.backups||[]).filter(b=>b.chunks&&b.date<keepFrom).forEach(b=>{
    for(let i=0;i<b.chunks;i++)FSM.deleteDoc(FSM.doc(FSdb,PFX+'backupchunks',b.id+'_'+i)).catch(()=>{});
    FSM.deleteDoc(FSM.doc(FSdb,PFX+'backups',b.id)).catch(()=>{});
  });
}
function backupList(){
  return (db.backups||[]).filter(b=>b.chunks).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
}
async function backupRestore(id){
  const b=(db.backups||[]).find(x=>x.id===id);if(!b)return;
  if(me.role!=='admin')return toast('רק מנהל יכול לשחזר');
  if(!confirm('לשחזר את הנתונים מהגיבוי של '+dt(b.date)+'?\nכל מה שנעשה מאז יוחלף. מומלץ לגבות קודם את המצב הנוכחי.'))return;
  try{
    toast('משחזר…');
    let s='';
    for(let i=0;i<b.chunks;i++){
      const d=await FSM.getDoc(FSM.doc(FSdb,PFX+'backupchunks',b.id+'_'+i));
      s+=((d.data&&d.data())||{}).d||'';
    }
    const data=JSON.parse(s);
    const keep={fbcfg:db.settings.fbcfg,testMode:db.settings.testMode,appCheckKey:db.settings.appCheckKey};
    db=Object.assign(db,data);
    db.settings=Object.assign({},data.settings,keep);
    logAct('שוחזרו נתונים מגיבוי '+dt(b.date));
    save();render();toast('שוחזר');
  }catch(e){toast('השחזור נכשל');}
}
/* גיבוי אוטומטי — פעם ביום, מהמחשב של המנהל שנכנס */
function backupAuto(){
  if(!_live||!me||me.role!=='admin')return;
  if(db.settings.lastBackup===today())return;
  setTimeout(()=>backupToCloud(true),20000);
}

/* =========================================================================
   עיכבון — מעקב ושחרור
   ========================================================================= */
function retClient(){
  const out=[];
  db.contracts.forEach(c=>{
    const invs=db.cinv.filter(i=>i.contractId===c.id&&i.status!=='טיוטה');
    const held=invs.reduce((s,i)=>s+cinvCalc(i).ret,0);
    const released=(db.retrel||[]).filter(r=>r.kind==='cli'&&r.refId===c.id).reduce((s,r)=>s+(Number(r.amount)||0),0);
    if(held>1||released)out.push({kind:'cli',id:c.id,name:c.name,
      party:client(project(c.projectId).clientId).name,project:project(c.projectId).name,
      held,released,open:held-released,due:c.bedekEnd||''});
  });
  return out.sort((a,b)=>b.open-a.open);
}
function retSub(){
  const out=[];
  db.subs.forEach(s=>{
    const invs=db.sinv.filter(i=>i.subId===s.id);
    const held=invs.reduce((a,i)=>a+sinvCalc(i).ret,0);
    const released=(db.retrel||[]).filter(r=>r.kind==='sub'&&r.refId===s.id).reduce((a,r)=>a+(Number(r.amount)||0),0);
    if(held>1||released)out.push({kind:'sub',id:s.id,name:s.name,party:s.name,project:'',
      held,released,open:held-released,due:''});
  });
  return out.sort((a,b)=>b.open-a.open);
}
function retRelease(kind,refId){
  const rows=kind==='cli'?retClient():retSub();
  const r=rows.find(x=>x.id===refId);if(!r)return;
  openModal('שחרור עיכבון — '+r.name,
    `<div class="alert info">${kind==='cli'?'עיכבון שהלקוח מחזיק אצלו':'עיכבון שאתה מחזיק לקבלן'} ·
      נצבר ${money(r.held)} · שוחרר עד כה ${money(r.released)} · <b>פתוח ${money(r.open)}</b></div>
     ${F([{k:'relDate',l:'תאריך השחרור',t:'date',d:today()},
          {k:'relAmount',l:'סכום לשחרור',t:'number',step:'0.01',d:Math.max(0,r.open).toFixed(2)},
          {k:'relNote',l:'הערה',w:2,ph:'גמר בדק / סיום פרויקט'}],{},'g4')}`,
    `<button class="btn" onclick="retRelSave('${kind}','${refId}')">רישום השחרור</button>
     <button class="btn sec" onclick="closeModal()">ביטול</button>`);
}
function retRelSave(kind,refId){
  const amount=numOf(fv('relAmount')),date=fv('relDate');
  if(!amount)return toast('צריך סכום');

  const rows=[];
  db.cinv.filter(i=>i.status==='הוגש ללקוח'||i.status==='אושר').forEach(i=>{

    const due=cinvDue(i), late=daysLate(due);

    rows.push({i,cli:client(cinvClient(i)).name,due,late,open});
  });
  return {buckets,rows:rows.sort((a,b)=>b.late-a.late)};
}

/* =========================================================================
   קיצורי מקלדת
   העבודה כאן היא הזנה יומיומית — היד לא צריכה לעזוב את המקלדת.
   ========================================================================= */
function modalOpen(){const o=document.getElementById('ov');return o&&o.classList.contains('on');}
function primaryBtn(){
  const f=document.querySelector('#modal footer');
  if(!f)return null;
  return f.querySelector('.btn:not(.sec):not(.dan)');
}
function inField(e){
  const t=e.target;
  return t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.tagName==='SELECT');
}
document.addEventListener('keydown',e=>{
  /* Ctrl+Enter — שמירה מכל מקום בטופס */
  if((e.ctrlKey||e.metaKey)&&e.key==='Enter'&&modalOpen()){
    const b=primaryBtn();
    if(b){e.preventDefault();b.click();}
    return;
  }
  /* Ctrl+K — קפיצה לחיפוש הגלובלי (זיהוי לפי מיקום הקליד, כדי שיעבוד גם במקלדת עברית) */
  if((e.ctrlKey||e.metaKey)&&(e.code==='KeyK')){
    const g=document.getElementById('gq');
    if(g){e.preventDefault();g.focus();g.select();}
    return;
  }
  /* ניווט בתוצאות החיפוש */
  const box=document.getElementById('gres');
  if(box&&box.classList.contains('on')&&['ArrowDown','ArrowUp','Enter'].includes(e.key)){
    const btns=[...box.querySelectorAll('button')];
    if(btns.length){
      let ix=btns.findIndex(b=>b.classList.contains('sel'));
      if(e.key==='Enter'){
        e.preventDefault();(btns[ix<0?0:ix]).click();return;
      }
      e.preventDefault();
      ix=e.key==='ArrowDown'?Math.min(btns.length-1,ix+1):Math.max(0,ix-1);
      btns.forEach(b=>b.classList.remove('sel'));
      btns[ix].classList.add('sel');btns[ix].scrollIntoView({block:'nearest'});
      return;
    }
  }
  /* N — פתיחת רשומה חדשה במסך הנוכחי */
  if(!modalOpen()&&!inField(e)&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&e.code==='KeyN'){
    const b=[...document.querySelectorAll('#app .head .btn')].find(x=>x.textContent.trim().startsWith('+'));
    if(b){e.preventDefault();b.click();}
  }
},true);
/* Enter בשורות פריטים — לשדה המקביל בשורה הבאה, ובסוף מוסיף שורה */
function lineKey(e,addFn){
  if(e.key!=='Enter')return;
  const td=e.target.closest('td'), tr=e.target.closest('tr');
  if(!td||!tr)return;
  e.preventDefault();
  const col=[...tr.children].indexOf(td);
  const next=tr.nextElementSibling;
  if(next){
    const inp=next.children[col]&&next.children[col].querySelector('input,select');
    if(inp){inp.focus();inp.select&&inp.select();return;}
  }
  if(addFn){
    addFn();
    setTimeout(()=>{
      const rows=tr.parentElement.children;
      const last=rows[rows.length-1];
      const inp=last&&last.children[col]&&last.children[col].querySelector('input,select');
      if(inp){inp.focus();inp.select&&inp.select();}
    },30);
  }
}

function periodRange(y,p,mode){
  y=Number(y);
  if(mode==='year')return {from:y+'-01-01',to:y+'-12-31',label:'שנת '+y};
  if(mode==='month'){const m=String(p).padStart(2,'0');
    return {from:y+'-'+m+'-01',to:iso(new Date(y,Number(p),0)),label:'חודש '+m+'/'+y};}
  /* דו-חודשי */
  const m1=(p-1)*2+1, m2=m1+1;
  return {from:y+'-'+String(m1).padStart(2,'0')+'-01',
          to:iso(new Date(y,m2,0)),
          label:String(m1).padStart(2,'0')+'–'+String(m2).padStart(2,'0')+'/'+y};
}
function inRange(d,r){d=String(d||'').slice(0,10);return d&&d>=r.from&&d<=r.to;}

       {l:'',f:r=>`<button class="btn sec sm" onclick="payForm('${r.i.id}','sinv')">תשלום</button>`}],
      rows,'אין חשבונות פתוחים לקבלנים','')}</div>`;
}
function exportPaySub(){
  csvDown('יתרות-קבלנים',[['קבלן','חשבון','פרויקט','מועד','ימי פיגור','יתרה'],
    ...db.sinv.filter(i=>sinvOpen(i)>1).map(i=>{
      const due=i.due||calcDue(i.date,subc(i.subId).terms||'שוטף+60');
      return [subc(i.subId).name,i.num,project(i.projectId).name,due,daysLate(due),sinvOpen(i).toFixed(2)];})]);
}

/* ---------- תזרים צפוי קדימה ---------- */
function cashForecast(){
  const win=[30,60,90];
  const out=win.map(d=>{
    const lim=iso(new Date(Date.now()+d*86400000));
    const inn=db.cinv.filter(i=>i.status!=='טיוטה'&&cinvOpen(i)>1&&cinvDue(i)<=lim)
      .reduce((s,i)=>s+cinvOpen(i),0);
    const o1=db.pinv.filter(i=>pinvOpen(i)>1&&(i.due||'')<=lim).reduce((s,i)=>s+pinvOpen(i),0);
    const o2=db.sinv.filter(i=>sinvOpen(i)>1&&(i.due||i.date||'')<=lim).reduce((s,i)=>s+sinvOpen(i),0);
    return {d,inn,out:o1+o2,net:inn-o1-o2};
  });
  return out;
}
