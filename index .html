<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מערכת הבקרה VAS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700;800&family=Rubik:wght@500;600;700;800&display=swap" rel="stylesheet">
<style id="appcss">

/* =========================================================================
   מערכת הבקרה של VAS — שפה עיצובית
   קרקע קרירה עם נטייה כחלחלה, סרגל צד כהה קבוע, מבטא טורקיז.
   העמוד מחויב למראה בהיר אחד ומצייר כל צבע במפורש.
   ========================================================================= */
:root{
  /* קרקע ומשטחים */
  --bg:#eef1f6; --card:#ffffff; --card2:#f7f9fc; --line:#dde3ec; --line2:#eaeff6;
  /* דיו */
  --txt:#101a2b; --muted:#65758c; --faint:#8b9ab0;
  /* סרגל הצד */
  --nav:#0b1727; --nav2:#132437; --navtxt:#9fb1c7; --navon:#ffffff;
  /* מבטא */
  --brand:#0e7c86; --brand-d:#0a626a; --brand-l:#d8f0f2; --brand-ring:#8fd4da;
  /* סמנטי */
  --blue:#2563eb; --amber:#b7791f; --red:#c53030; --green:#2f855a; --violet:#6b46c1;
  --r:10px; --r-lg:14px;
  --shadow:0 1px 2px rgba(16,26,43,.05),0 10px 26px -16px rgba(16,26,43,.28);
  --shadow-lg:0 24px 60px -20px rgba(16,26,43,.4);
  --sb:236px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--txt);
  font-family:'Assistant',"Segoe UI",Arial,sans-serif;font-size:14.5px;line-height:1.45;
  -webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
h1,h2,h3,.logo,.kpi .v,.tot .big{font-family:'Rubik','Assistant',"Segoe UI",Arial,sans-serif}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- שלד: סרגל צד קבוע + אזור תוכן ---------- */
.app{display:flex;min-height:100vh;background:var(--bg)}
.side{width:var(--sb);flex:0 0 var(--sb);background:var(--nav);color:var(--navtxt);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:hidden}
.side .brand{display:flex;align-items:center;gap:10px;padding:16px 16px 14px;border-bottom:1px solid rgba(255,255,255,.07)}
.side .brand .mark{width:32px;height:32px;border-radius:9px;background:linear-gradient(150deg,var(--brand),#12b3a8);
  display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px;letter-spacing:.5px;flex:0 0 auto}
.side .brand .nm{font-family:'Rubik','Assistant',"Segoe UI",Arial,sans-serif;font-weight:700;font-size:15px;color:#fff;line-height:1.15}
.side .brand .nm small{display:block;font-weight:500;font-size:11.5px;color:var(--navtxt);letter-spacing:.02em}
.side .scroll{flex:1;overflow-y:auto;padding:10px 10px 16px}
.side .scroll::-webkit-scrollbar{width:8px}
.side .scroll::-webkit-scrollbar-thumb{background:#22344a;border-radius:8px}
.navg{margin-bottom:4px}
.navg>button{width:100%;display:flex;align-items:center;gap:9px;background:transparent;border:0;color:var(--navtxt);
  padding:9px 10px;border-radius:9px;cursor:pointer;font-weight:700;font-size:13.5px;text-align:right}
.navg>button:hover{background:var(--nav2);color:#fff}
.navg>button .ic{width:18px;height:18px;flex:0 0 18px;opacity:.85}
.navg>button .ch{margin-inline-start:auto;font-size:10px;opacity:.6;transition:transform .18s}
.navg.open>button{color:#fff}
.navg.open>button .ch{transform:rotate(180deg)}
.navg .items{display:none;padding:2px 0 6px 0;margin-inline-start:14px;border-inline-start:1px solid rgba(255,255,255,.09)}
.navg.open .items{display:block}
.navg .items button{display:block;width:100%;text-align:right;background:transparent;border:0;color:var(--navtxt);
  padding:6.5px 12px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600}
.navg .items button:hover{background:var(--nav2);color:#fff}
.navg .items button.on{background:var(--brand);color:#fff}
.side .foot{padding:10px 12px;border-top:1px solid rgba(255,255,255,.07);font-size:11.5px;color:#64778f}
/* גישה מהירה — תמיד גלוי בראש הסרגל */
.side .quick{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:10px 10px 2px}
.side .quick button{background:var(--nav2);border:1px solid rgba(255,255,255,.09);color:#fff;border-radius:9px;
  padding:8px 4px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
.side .quick button:hover{border-color:var(--brand-ring)}
.side .quick button.on{background:var(--brand);border-color:var(--brand)}
/* בחירה מרובה ברשימות */
.selbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--brand-l);border:1px solid var(--brand-ring);
  border-radius:12px;padding:9px 12px;margin-bottom:12px;font-weight:700;color:var(--brand-d)}
.selbar .n{background:var(--brand);color:#fff;border-radius:999px;padding:2px 10px;font-size:12.5px}
td.selc,th.selc{width:34px;padding-inline:8px}
td.selc input,th.selc input{width:16px;height:16px;cursor:pointer;margin:0}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:56px;background:var(--card);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:12px;padding:0 18px;position:sticky;top:0;z-index:40}
.topbar .crumb{font-weight:800;font-size:15px;font-family:'Rubik','Assistant',"Segoe UI",Arial,sans-serif;white-space:nowrap}
.topbar .crumb i{font-style:normal;color:var(--faint);font-weight:600;margin:0 6px}
.gsearch{flex:1;max-width:420px;position:relative}
.gsearch input{padding:8px 34px 8px 12px;background:var(--card2);border:1px solid var(--line);border-radius:9px}
.gsearch .mag{position:absolute;inset-inline-start:auto;inset-inline-end:11px;top:50%;transform:translateY(-50%);color:var(--faint);pointer-events:none}
.gres{position:absolute;top:42px;inset-inline-end:0;width:min(460px,80vw);background:var(--card);border:1px solid var(--line);
  border-radius:12px;box-shadow:var(--shadow-lg);z-index:60;max-height:60vh;overflow:auto;display:none}
.gres.on{display:block}
.gres button{display:block;width:100%;text-align:right;background:none;border:0;border-bottom:1px solid var(--line2);
  padding:9px 13px;cursor:pointer;font-size:13.5px}
.gres button:hover,.gres button.sel{background:var(--brand-l)}
.gres .k{color:var(--faint);font-size:11.5px;font-weight:700}
.topbar .spacer{flex:1}
.syncdot{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
.syncdot .d{width:8px;height:8px;border-radius:99px;background:var(--green)}
.syncdot .d.off{background:var(--faint)}.syncdot .d.busy{background:var(--amber)}
.uchip{display:flex;align-items:center;gap:8px;white-space:nowrap}
.uchip .av{width:31px;height:31px;border-radius:9px;background:var(--brand-l);color:var(--brand-d);
  display:grid;place-items:center;font-weight:800;font-size:12.5px}
.uchip .t{font-size:12.5px;line-height:1.2}
.uchip .t b{display:block;font-size:13px}
.uchip .t span{color:var(--muted)}
.iconbtn{background:var(--card2);border:1px solid var(--line);color:var(--muted);width:33px;height:33px;
  border-radius:9px;cursor:pointer;display:grid;place-items:center}
.iconbtn:hover{background:var(--brand-l);color:var(--brand-d);border-color:var(--brand-ring)}
.iconbtn.need{background:var(--brand);color:#fff;border-color:var(--brand);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(14,124,134,.45)}50%{box-shadow:0 0 0 6px rgba(14,124,134,0)}}
.burger{display:none}

.wrap{padding:20px 22px 60px;max-width:1560px;width:100%;margin:0 auto}
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap}
h1{font-size:21px;margin:0;letter-spacing:-.2px;text-wrap:balance}
.sub{color:var(--muted);font-size:12.5px;margin-top:3px}

/* ---------- כרטיסים ומדדים ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.pad{padding:16px 18px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:13px 15px;
  box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi:before{content:"";position:absolute;inset-block-start:0;inset-inline-start:0;width:3px;height:100%;background:var(--brand)}
.kpi.b:before{background:var(--blue)}.kpi.a:before{background:var(--amber)}.kpi.r:before{background:var(--red)}
.kpi.g:before{background:var(--green)}.kpi.v:before{background:var(--violet)}
.kpi .l{color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.01em}
.kpi .v{font-size:22px;font-weight:700;margin-top:2px;letter-spacing:-.6px;font-variant-numeric:tabular-nums}
.kpi .n{font-size:11.5px;color:var(--faint);margin-top:2px}

/* ---------- כפתורים ---------- */
.btn{background:var(--brand);color:#fff;border:1px solid var(--brand);padding:8px 15px;border-radius:9px;
  cursor:pointer;font-weight:700;font-size:13.5px;transition:background .15s,border-color .15s}
.btn:hover{background:var(--brand-d);border-color:var(--brand-d)}
.btn.sec{background:var(--card);color:var(--txt);border-color:var(--line)}
.btn.sec:hover{background:var(--card2);border-color:var(--brand-ring)}
.btn.dan{background:var(--red);border-color:var(--red)}.btn.dan:hover{background:#9b2626;border-color:#9b2626}
.btn.gho{background:transparent;border-color:transparent;color:var(--brand-d)}
.btn.gho:hover{background:var(--brand-l)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.linkbtn{background:none;border:0;color:var(--brand-d);cursor:pointer;padding:2px 3px;font-weight:700;text-decoration:underline;text-underline-offset:3px}
.linkbtn:hover{color:var(--brand)}

/* ---------- טפסים ---------- */
.grid{display:grid;gap:13px}
.g1{grid-template-columns:1fr}.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:4px}
input,select,textarea{width:100%;padding:8px 11px;border:1px solid var(--line);border-radius:9px;background:var(--card);transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-l)}
input[readonly]{background:var(--card2);color:var(--muted)}
.filters{display:flex;gap:9px;flex-wrap:wrap;align-items:end;margin-bottom:13px}
.filters .f{min-width:158px}
.hint{font-size:12px;color:var(--faint);margin-top:6px}

/* ---------- טבלאות ---------- */
table{width:100%;border-collapse:collapse}
th{text-align:right;font-size:11.5px;color:var(--muted);font-weight:700;padding:10px 11px;
  border-bottom:1px solid var(--line);white-space:nowrap;background:var(--card2);letter-spacing:.02em}
td{padding:9px 11px;border-bottom:1px solid var(--line2);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--card2)}
.tbl-wrap{overflow-x:auto;border-radius:var(--r-lg)}
.num,.mono{font-variant-numeric:tabular-nums;white-space:nowrap}
.mono{font-weight:700}
.empty{padding:46px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--txt);font-size:16px;margin-bottom:6px;font-family:'Rubik','Assistant',"Segoe UI",Arial,sans-serif}

/* ---------- תגיות והתראות ---------- */
.tag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap}
.t-gray{background:#eef1f6;color:#516179}.t-blue{background:#dbeafe;color:#1d4ed8}.t-amber{background:#fdf0d5;color:#8a5a08}
.t-green{background:#d8f3e3;color:#226946}.t-red{background:#fde3e3;color:#9b2626}.t-violet{background:#e9e3fb;color:#553c9a}
.alert{padding:10px 14px;border-radius:10px;margin-bottom:12px;font-weight:600;font-size:13.5px}
.alert.warn{background:#fdf0d5;color:#7c4f08;border:1px solid #f2ddb0}
.alert.err{background:#fde3e3;color:#8c2222;border:1px solid #f6c6c6}
.alert.ok{background:#d8f3e3;color:#1c5c3d;border:1px solid #b3e3ca}
.alert.info{background:#dceefb;color:#0f4c75;border:1px solid #bcdcf3}
.alertrow{cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;transition:filter .15s}
.alertrow:hover{filter:brightness(.97)}
.alertrow .go{opacity:.55;font-weight:800}

/* ---------- מודאל ---------- */
.overlay{position:fixed;inset:0;background:rgba(11,23,39,.55);display:none;align-items:flex-start;
  justify-content:center;z-index:100;padding:24px;overflow:auto;backdrop-filter:blur(2px)}
.overlay.on{display:flex}
.modal{background:var(--card);border-radius:16px;width:100%;max-width:1020px;box-shadow:var(--shadow-lg)}
.modal header{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;border-bottom:1px solid var(--line)}
.modal header h3{margin:0;font-size:17px}
.modal .body{padding:20px;max-height:calc(100vh - 210px);overflow:auto}
.modal footer{padding:13px 20px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;
  background:var(--card2);border-radius:0 0 16px 16px}
.x{background:none;border:0;font-size:24px;cursor:pointer;color:var(--faint);line-height:1}
.x:hover{color:var(--txt)}

/* ---------- שורות מסמך ---------- */
.lines th{background:var(--card2)}.lines input,.lines select{padding:6px 8px}.lines td{padding:5px 6px}
.rm{background:#fde3e3;color:#9b2626;border:0;border-radius:7px;width:28px;height:28px;cursor:pointer;font-weight:800}
.rm:hover{background:#f8cccc}
.totbox{display:flex;margin-top:14px}
.tot{min-width:310px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:13px 15px}
.tot div{display:flex;justify-content:space-between;padding:3px 0;gap:20px;font-variant-numeric:tabular-nums}
.tot .neg{color:var(--red)}
.tot .big{border-top:1px solid var(--line);margin-top:7px;padding-top:9px;font-size:18px;font-weight:700}
.match{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin:13px 0}
.match .m{border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;background:var(--card)}
.match .m .l{font-size:11.5px;color:var(--muted);font-weight:700}
.match .m .v{font-size:19px;font-weight:800;margin-top:3px;font-variant-numeric:tabular-nums}
.match .m.ok{border-color:#b3e3ca;background:#f2fbf6}.match .m.bad{border-color:#f6c6c6;background:#fef6f6}

/* ---------- גרפים ---------- */
.bars{display:flex;align-items:flex-end;gap:9px;height:180px;padding-top:10px}
.bars .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;min-width:0}
.bars .b .stack{width:100%;display:flex;gap:3px;align-items:flex-end;justify-content:center}
.bars .b .bar{flex:1;background:var(--brand);border-radius:5px 5px 0 0;min-height:3px;transition:height .3s}
.bars .b .bar.c2{background:#c05621}
.bars .b .lb{font-size:11px;color:var(--muted)}.bars .b .vl{font-size:10.5px;font-weight:700;color:var(--faint)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);font-weight:600;margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px}
.bar-mini{height:7px;background:var(--line);border-radius:99px;overflow:hidden;min-width:74px}
.bar-mini i{display:block;height:100%;background:var(--brand);border-radius:99px}
.bar-mini i.over{background:var(--red)}.bar-mini i.warn{background:var(--amber)}
.section-title{font-weight:700;font-size:14.5px;margin:20px 0 11px;padding-bottom:7px;
  border-bottom:1px solid var(--line);font-family:'Rubik','Assistant',"Segoe UI",Arial,sans-serif}
.section-title:first-child{margin-top:0}
.rowacts{display:flex;gap:4px;white-space:nowrap}
/* עמודת הפעולות נשארת מוצמדת לקצה גם כשהטבלה רחבה מהמסך */
table th:last-child,table td:last-child{position:sticky;inset-inline-start:0;background:var(--card);
  box-shadow:-6px 0 8px -8px rgba(16,26,43,.25)}
table th:last-child{background:var(--card2);z-index:2}
tbody tr:hover td:last-child{background:var(--card2)}
@media print{table th:last-child,table td:last-child{position:static;box-shadow:none}}


/* ---------- אזור גרירת קבצים ---------- */
.dz{border:2px dashed var(--line);border-radius:12px;padding:18px 16px;text-align:center;cursor:pointer;
  background:var(--card2);transition:border-color .15s,background .15s;margin-bottom:10px}
.dz:hover,.dz:focus-visible{border-color:var(--brand-ring);background:var(--brand-l)}
.dz.over{border-color:var(--brand);background:var(--brand-l)}
.dz .ic{font-size:22px;line-height:1;color:var(--brand-d);margin-bottom:4px}
.dz b{display:block;font-size:13.5px}
.dz span{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.filelist{display:flex;flex-direction:column;gap:7px}
.fileitem{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;
  padding:8px 11px;background:var(--card)}
.fileitem .ic{font-size:19px;flex:0 0 auto}
.fileitem .meta{flex:1;min-width:0}
.fileitem .meta b{display:block;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fileitem .meta span{font-size:11.5px;color:var(--muted)}
@media(max-width:700px){.fileitem{flex-wrap:wrap}}

/* ---------- השלמה אוטומטית בהזמנת רכש ---------- */
.acbox{display:none;border:1px solid var(--line);border-radius:12px;background:var(--card);
  box-shadow:var(--shadow);margin-top:8px;overflow:hidden}
.acbox.on{display:block}
.achead{font-size:11.5px;font-weight:700;color:var(--muted);padding:8px 12px;background:var(--card2);
  border-bottom:1px solid var(--line)}
.acrow{padding:9px 12px;border-bottom:1px solid var(--line2)}
.acrow:last-child{border-bottom:0}
.acmain{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.acmain b{font-size:13.5px}
.acmain .k{font-size:11.5px;color:var(--faint);font-weight:700}
.acoffers{display:flex;gap:6px;flex-wrap:wrap}
.acoffer{display:flex;align-items:center;gap:7px;background:var(--card2);border:1px solid var(--line);
  border-radius:9px;padding:5px 10px;cursor:pointer;font-size:12.5px}
.acoffer:hover{border-color:var(--brand);background:var(--brand-l)}
.acoffer b{font-variant-numeric:tabular-nums}
.acoffer i{font-style:normal;font-size:10.5px;font-weight:700;color:var(--green)}
.acoffer.best{border-color:#b3e3ca;background:#f2fbf6}
.acoffer.cur{outline:2px solid var(--brand-ring);outline-offset:-2px}
td.ac{position:relative}

/* ---------- טוסט ---------- */
.toast{position:fixed;bottom:24px;inset-inline-end:24px;background:var(--nav);color:#fff;padding:12px 18px;
  border-radius:11px;z-index:200;opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none;font-weight:600;
  box-shadow:var(--shadow-lg)}
.toast.on{opacity:1;transform:none}

/* ---------- מסך כניסה ---------- */
.login{min-height:100vh;display:grid;place-items:center;padding:24px;
  background:radial-gradient(1100px 620px at 78% -12%,#14424a 0%,transparent 62%),linear-gradient(158deg,#0b1727,#0d2233 62%,#0b1727)}
.login .box{background:var(--card);border-radius:18px;padding:34px 32px;width:372px;box-shadow:0 34px 80px rgba(0,0,0,.42);text-align:center}
.login .mark{width:52px;height:52px;border-radius:15px;margin:0 auto 14px;background:linear-gradient(150deg,var(--brand),#12b3a8);
  display:grid;place-items:center;color:#fff;font-weight:800;font-size:19px;font-family:'Rubik','Assistant',"Segoe UI",Arial,sans-serif}
.login h2{margin:0 0 4px;font-size:22px}
.login .p{color:var(--muted);font-size:13px;margin-bottom:18px}
.login input{text-align:center;font-size:25px;letter-spacing:11px;padding:12px;font-variant-numeric:tabular-nums}
.login .users{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.login .users button{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;
  cursor:pointer;font-weight:700;text-align:right;display:flex;justify-content:space-between;align-items:center}
.login .users button:hover{background:var(--brand-l);border-color:var(--brand-ring)}
.login .users span{color:var(--muted);font-weight:600;font-size:12px}

/* ---------- טאבים פנימיים ---------- */
.tabs{display:flex;gap:3px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:9px 14px;cursor:pointer;
  font-weight:700;color:var(--muted);white-space:nowrap;font-size:13.5px}
.tabs button:hover{color:var(--txt)}
.tabs button.on{color:var(--brand-d);border-bottom-color:var(--brand)}

/* ---------- גאנט ---------- */
.gantt{overflow-x:auto}
.gantt table{min-width:760px}
.gantt .track{position:relative;height:22px;background:var(--line2);border-radius:6px;min-width:220px}
.gantt .track i{position:absolute;top:0;height:100%;border-radius:6px;background:var(--brand);display:block}
.gantt .track i.done{background:var(--green)}.gantt .track i.late{background:var(--red)}
.gantt .track i.soon{background:var(--amber)}
.gantt .track .today{position:absolute;top:-3px;height:28px;width:2px;background:var(--red);opacity:.7}

@media(max-width:1080px){.g3,.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:860px){
  .side{position:fixed;top:0;right:0;left:auto;z-index:90;height:100dvh;
    transform:translate(100%,0);transition:transform .22s;will-change:transform}
  .side.on{transform:translate(0,0);box-shadow:var(--shadow-lg)}
  .sidebg{position:fixed;inset:0;background:rgba(11,23,39,.5);z-index:89;display:none}
  .sidebg.on{display:block}
  .burger{display:grid}
  .g2,.g3,.g4{grid-template-columns:1fr}.match{grid-template-columns:1fr}
  .wrap{padding:14px}.gsearch{display:none}.uchip .t{display:none}
  .app{overflow-x:hidden}
  body{overflow-x:hidden}
}
@media print{
  .side,.topbar,.filters,.rowacts,.btn,.tabs{display:none!important}
  body{background:#fff}.wrap{padding:0}.card{box-shadow:none;border-color:#ccc}
}

<body>
<div id="root"></div>
<div class="overlay" id="ov" onclick="if(event.target===this)closeModal()"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="filein" style="display:none">

<script id="appjs">
/* =========================================================================
   מערכת הבקרה של VAS — קובץ אחד, ללא התקנה.
   הנתונים נשמרים בדפדפן (localStorage) ומסתנכרנים לענן אם מוגדר Firebase.
   ========================================================================= */
const KEY='vas_control_v1';
const APPVER='4.3';
const VAT=18, RETENTION=10, INSURANCE=1;
const TERMS=['מזומן','שוטף','שוטף+30','שוטף+45','שוטף+60','שוטף+90','30 יום','60 יום'];
const DISCIPLINES=['ביטחון / מצלמות','גילוי וכיבוי אש','בקרת כניסה','תקשורת ותשתיות','חדרי שרתים','מערכות אזעקה','אחר'];
const PRJ_STATUS=['בהקמה','בביצוע','בבדק','הסתיים','מוקפא'];
const PO_STATUS=['טיוטה','נשלחה לספק','אושרה','בוטלה'];
const INV_STATUS=['טיוטה','הוגש ללקוח','אושר','שולם'];
const SINV_STATUS=['התקבל','אושר','שולם'];
const DESTS=['מחסן ראשי','אתר הפרויקט','משלוח ישיר ללקוח'];
const ROLES={admin:'מנהל',office:'משרד',field:'שטח'};
const BUDGET_CATS=['חומר ורכש','קבלני משנה','עבודה עצמית','ציוד וכלים','אחר'];
const TASK_STATUS=['לביצוע','בעבודה','ממתין','הושלם'];
/* אוספי הנתונים — משמשים למיזוג בין שני מחשבים */
const COLLS=['clients','projects','contracts','cinv','subs','sinv','suppliers','pos','dns','pinv','stock','moves','users','plists','tasks','costs','subwork','masters','payments','files','backups','retrel','quotes'];
/* אוספים שלא נמשכים לזיכרון: תוכן הקבצים והגיבויים */

let db=null, me=null, grp='dash', view='dash';
let ART=null, DL=null, _base=null, _syncState='local', _pushT=null, _pendingPush=false;

/* =========================================================================
   אחסון וסנכרון
   הנתונים חיים ב-localStorage של כל מחשב ומסתנכרנים דרך העמוד עצמו.
   כשמגיע עדכון מהמחשב השני, השינויים המקומיים שטרם נשלחו מוחלים מעליו
   ברמת רשומה — כך ששני אנשים שעובדים במקביל לא דורסים זה את זה.
   ========================================================================= */
function seedFromPage(){
  const el=document.getElementById('appdata');
  if(!el)return null;
  try{const d=JSON.parse(el.textContent);return (d&&d.clients)?d:null;}catch(e){return null;}
}
function load(){
  let local=null;
  try{const r=localStorage.getItem(KEY);if(r)local=JSON.parse(r);}catch(e){}
  const cloud=seedFromPage();
  try{const b=localStorage.getItem(KEY+'_base');if(b)_base=JSON.parse(b);}catch(e){}
  if(!local&&!cloud)return seed();
  if(!local)  {_base=deep(cloud);saveBase();return cloud;}
  if(!cloud)  return local;
  /* שתי גרסאות — מאמצים את זו של הענן ומחילים מעליה את מה שנעשה כאן ולא נשלח */
  if((cloud.rev||0)>(local.rev||0)||(cloud.updated||'')>(local.updated||'')){
    const merged=mergeLocalOver(cloud,local,_base);
    _base=deep(cloud);saveBase();
    _pendingPush=hasDelta(local,_base);
    return merged;
  }
  return local;
}
function deep(o){return JSON.parse(JSON.stringify(o));}
function saveBase(){try{localStorage.setItem(KEY+'_base',JSON.stringify(_base));}catch(e){}}
function idx(arr){const m={};(arr||[]).forEach(r=>{if(r&&r.id)m[r.id]=r;});return m;}
function hasDelta(local,base){
  if(!base)return true;
  return COLLS.some(c=>{
    const L=idx(local[c]),B=idx(base[c]);
    return Object.keys(L).some(id=>JSON.stringify(L[id])!==JSON.stringify(B[id]));
  });
}
/* מחילים על גרסת הענן כל רשומה שהשתנתה כאן מאז הסנכרון האחרון */
function mergeLocalOver(cloud,local,base){
  const out=deep(cloud);
  if(!base){ /* אין נקודת ייחוס — שומרים את שתי הקבוצות ומעדיפים את המקומי */
    COLLS.forEach(c=>{
      const m=idx(out[c]);(local[c]||[]).forEach(r=>{m[r.id]=r;});
      out[c]=Object.values(m);
    });
    return out;
  }
  let changed=0;
  COLLS.forEach(c=>{
    const L=idx(local[c]),B=idx(base[c]),O=idx(out[c]);
    Object.keys(L).forEach(id=>{
      if(JSON.stringify(L[id])!==JSON.stringify(B[id])){O[id]=L[id];changed++;}
    });
    /* רשומה שנמחקה כאן ולא נגעו בה בענן — נמחקת גם במיזוג */
    Object.keys(B).forEach(id=>{
      if(!L[id]&&O[id]&&JSON.stringify(O[id])===JSON.stringify(B[id])){delete O[id];changed++;}
    });
    out[c]=Object.values(O);
  });
  out.log=[...(local.log||[]),...(out.log||[])]
    .filter((v,i,a)=>a.findIndex(x=>x.t===v.t&&x.a===v.a&&x.u===v.u)===i)
    .sort((a,b)=>(b.t||'').localeCompare(a.t||'')).slice(0,600);
  out.settings=Object.assign({},out.settings,{fb:(local.settings||{}).fb});
  if(changed)out.rev=Math.max(out.rev||0,local.rev||0)+1;
  return out;
}
function save(silent){
  db.updated=new Date().toISOString();
  db.rev=(db.rev||0)+1;
  try{localStorage.setItem(KEY,JSON.stringify(db));}
  catch(e){toast('אין מקום לשמור במחשב — כדאי להוריד גיבוי ולמחוק תנועות ישנות');}
  if(_live)livePush();
  if(!silent)flagSaved();
}
/* יש שינויים מקומיים שעדיין לא נשלחו — רלוונטי רק כשאין סנכרון חי */
function isDirty(){return (!_live&&ART)?hasDelta(db,_base):false;}

/* =========================================================================
   סנכרון חי מול Firestore
   כשמוגדר חיבור, כל שינוי נכתב מיד לענן וכל מי שפתוח רואה אותו תוך שנייה,
   בלי ללחוץ כלום. עובד גם בלי אינטרנט — מה שנרשם נשלח כשהחיבור חוזר.
   ========================================================================= */
const SDK_BASE=(window.__FBSDK_BASE__||'https://www.gstatic.com/firebasejs/10.12.0/');
/* החיבור לנתונים המשותפים של VAS — מוטמע בקובץ, אין צורך להזין כלום */
const BUILTIN_FB={
  apiKey:"AIzaSyC7J0s6YXQBtlezzK88-9bhRjG-c_Sl4gU",
  authDomain:"vas--system.firebaseapp.com",
  projectId:"vas--system",
  storageBucket:"vas--system.firebasestorage.app",
  messagingSenderId:"558157805234",
  appId:"1:558157805234:web:e9f4e6809fe82329533bab"
};
let PFX='ctrl_';
let FBapp=null, FSdb=null, FSM=null, AUTH=null, AUTHM=null, APPM=null, _authUser=null,
    _live=false, _liveErr='', _online=[], _renderT=null, _renderWanted=false, _beat=null;
function authUsersMode(){return db.settings.authMode==='users';}
function liveColls(){return COLLS.concat(['log']);}
/* לצוות השטח אין הרשאה לאוספים הכספיים, ולכן גם לא נרשמים אליהם */
const FIELD_COLLS=['users','projects','suppliers','pos','dns','stock','moves','tasks','files'];
function collsFor(role){
  if(role==='field')return FIELD_COLLS;
  return liveColls();
}
/* בעמוד המתארח אצל קלוד אי אפשר להתחבר ל-Firebase (חסימת אבטחה של הדפדפן),
   ולכן שם המערכת עובדת במצב המקומי עם הסנכרון של העמוד */
const ONCLAUDE=!!(window.claude&&window.claude.use)||/claude\.ai|claudeusercontent/i.test(location.hostname);
function fbCfg(){
  if(ONCLAUDE||db.settings.fbOff)return null;
  const c=db.settings.fbcfg;
  if(c){try{const o=(typeof c==='string')?JSON.parse(c):c;if(o&&o.projectId)return o;}catch(e){}}
  return (BUILTIN_FB&&BUILTIN_FB.projectId)?BUILTIN_FB:null;
}
function fbIsBuiltin(){return !ONCLAUDE&&!db.settings.fbOff&&!db.settings.fbcfg;}
function clean(o){return JSON.parse(JSON.stringify(o),(k,v)=>cleanText(v));}
/* מערכים גדולים — פריטי מחירון, כתב כמויות, שורות הצעה — נשמרים בענן כמחרוזת אחת.
   Firestore מגביל רשומה ל-40,000 ערכי אינדקס ול-1MB; מחירון של אלפי פריטים
   כמערך רגיל חורג מזה והשמירה נדחית בשקט. מחרוזת נספרת כערך אחד, וכשהיא
   ארוכה מדי היא נחתכת לחלקים באוסף נפרד. */
const PACK={plists:'items',contracts:'boq',quotes:'lines'};
const PACK_CHUNK=250000;
/* רשומות שהחלקים שלהן עדיין בדרך — לא נכתבות לענן עד שהן שלמות */
const _chunkPending={}, _chunkGen={}, _chunkCount={};
function chunkKey(c,id){return c+'/'+id;}
/* מחזיר {doc, ready} — ready הוא הבטחה שמסתיימת אחרי שכל החלקים נכתבו, ורק אז כותבים את הרשומה עצמה */
function packDoc(c,r,F){
  const k=PACK[c];const o=clean(r);
  if(!k||!Array.isArray(o[k]))return {doc:o,ready:Promise.resolve()};
  const str=JSON.stringify(o[k]);delete o[k];delete o[k+'Json'];delete o[k+'Chunks'];
  const key=chunkKey(c,o.id), prev=_chunkCount[key]||0;
  const writes=[];
  if(str.length<=PACK_CHUNK){o[k+'Json']=str;}
  else{
    const parts=[];for(let i=0;i<str.length;i+=PACK_CHUNK)parts.push(str.slice(i,i+PACK_CHUNK));
    if(F&&FSdb)parts.forEach((d,i)=>writes.push(F.setDoc(F.doc(FSdb,PFX+'bigchunks',c+'_'+o.id+'_'+i),{d})));
    o[k+'Chunks']=parts.length;
    _chunkCount[key]=parts.length;
  }
  /* חלקים שכבר לא צריך — נמחקים כדי שהאוסף לא יתנפח */
  const now=o[k+'Chunks']||0;
  if(F&&FSdb)for(let i=now;i<prev;i++)F.deleteDoc(F.doc(FSdb,PFX+'bigchunks',c+'_'+o.id+'_'+i)).catch(()=>{});
  if(!now)_chunkCount[key]=0;
  return {doc:o,ready:Promise.all(writes)};
}
function chunksDelete(c,id){
  const key=chunkKey(c,id),n=_chunkCount[key]||0;
  if(FSM&&FSdb)for(let i=0;i<Math.max(n,8);i++)FSM.deleteDoc(FSM.doc(FSdb,PFX+'bigchunks',c+'_'+id+'_'+i)).catch(()=>{});
  delete _chunkCount[key];
}
function unpackDoc(c,d,F){
  const k=PACK[c];if(!k||!d)return d;
  if(typeof d[k+'Json']==='string'){try{d[k]=JSON.parse(d[k+'Json']);}catch(e){d[k]=[];}delete d[k+'Json'];
    delete _chunkPending[chunkKey(c,d.id)];_chunkCount[chunkKey(c,d.id)]=0;}
  else if(d[k+'Chunks']){
    const n=d[k+'Chunks'];delete d[k+'Chunks'];
    const key=chunkKey(c,d.id);_chunkCount[key]=n;
    /* עד שהחלקים מגיעים משאירים את מה שכבר ידוע מקומית, והרשומה מסומנת "ממתינה" —
       שמירה בינתיים לא תדרוס אותה בענן במערך ריק */
    const known=(db&&db[c]||[]).find(x=>x&&x.id===d.id);
    d[k]=(known&&Array.isArray(known[k]))?known[k]:[];
    _chunkPending[key]=true;
    chunksFetch(c,d.id,n,F,0);
  }
  return d;
}
function chunksFetch(c,id,n,F,attempt){
  if(!F||!FSdb)return;
  const k=PACK[c], key=chunkKey(c,id), gen=(_chunkGen[key]=(_chunkGen[key]||0)+1);
  Promise.all(Array.from({length:n},(_,i)=>F.getDoc(F.doc(FSdb,PFX+'bigchunks',c+'_'+id+'_'+i))))
    .then(ds=>{
      if(_chunkGen[key]!==gen)return;           /* הגיעה גרסה חדשה יותר בינתיים */
      const parts=ds.map(x=>((x.data&&x.data())||{}).d);
      if(parts.some(x=>typeof x!=='string'))throw new Error('missing-chunk');
      const arr=JSON.parse(parts.join(''));
      const live=(db[c]||[]).find(x=>x.id===id);if(live)live[k]=arr;
      const b=_base&&_base[c]&&_base[c].find(x=>x.id===id);if(b)b[k]=deep(arr);
      delete _chunkPending[key];
      try{localStorage.setItem(KEY,JSON.stringify(db));}catch(e){}
      scheduleRender();
    })
    .catch(()=>{ /* חלק חסר או פגום (למשל כתיבה שעדיין באמצע) — מנסים שוב, הרשומה נשארת ממתינה */
      if(attempt<6)setTimeout(()=>{if(_chunkGen[key]===gen)chunksFetch(c,id,n,F,attempt+1);},3000*(attempt+1));
    });
}
/* שמירה לענן שנכשלה חייבת להיות גלויה — לא "נכנס" שנעלם */
let _failT=0;
function liveWriteFail(c,id,e){
  _liveErr=String((e&&e.message)||e);_syncState='err';paintSync();
  /* מחזירים את הרשומה למצב "לא נשלחה" כדי שהשמירה הבאה תנסה שוב */
  if(_base&&_base[c]){const ix=_base[c].findIndex(x=>x&&x.id===id);if(ix>=0)_base[c].splice(ix,1);saveBase();}
  if(Date.now()-_failT>8000){_failT=Date.now();
    toast('השמירה לענן נכשלה ('+(c||'')+') — הנתון נשמר במחשב וינסה שוב בשמירה הבאה');}
}
function liveSettings(s){const o=Object.assign({},s);delete o.fbcfg;delete o.lastSync;delete o.fb;return o;}

async function liveInit(){
  const cfg=fbCfg();
  if(!cfg||!cfg.projectId){_live=false;paintSync();return;}
  PFX=db.settings.testMode?'test_':'ctrl_';
  _liveErr='';_syncState='busy';paintSync();
  try{
    const A=await import(SDK_BASE+'firebase-app.js');
    const F=await import(SDK_BASE+'firebase-firestore.js');
    const U=await import(SDK_BASE+'firebase-auth.js');
    FSM=F;APPM=A;AUTHM=U;FBapp=A.initializeApp(cfg);
    try{FSdb=F.initializeFirestore(FBapp,{localCache:F.persistentLocalCache({tabManager:F.persistentMultipleTabManager()})});}
    catch(e){FSdb=F.getFirestore(FBapp);}
    AUTH=U.getAuth(FBapp);
    if(authUsersMode()){
      /* כניסה אישית: מחכים שהמשתמש ייכנס עם המייל והקוד שלו */
      U.onAuthStateChanged(AUTH,async user=>{
        _authUser=user||null;
        if(!user){_live=false;me=null;paintSync();renderLogin();return;}
        try{await liveStart(F);resolveMe();}
        catch(e){_liveErr=String(e.message||e);_syncState='err';paintSync();}
      });
      return;
    }
    try{await U.signInAnonymously(AUTH);}catch(e){}
    await liveStart(F);
    _syncState='ok';paintSync();
    toast('מחובר לנתונים המשותפים — כל שינוי מתעדכן אצל כולם');
  }catch(e){
    _live=false;_liveErr=String((e&&e.message)||e);_syncState='err';paintSync();
    toast('אין כרגע חיבור לשרת — העבודה נשמרת במחשב ותסונכרן כשהחיבור יחזור');
  }
}
async function liveStart(F){
  await liveFirstSync(F);
  liveSubscribeCore(F);
  livePresence(F);
  _live=true;_syncState='ok';paintSync();
  appCheckInit();backupAuto();
}
/* מוצאים את כרטיס המשתמש שמתאים לחשבון שנכנס */
function resolveMe(tries){
  if(!_authUser)return;
  const mail=String(_authUser.email||'').toLowerCase();
  const find=()=>db.users.find(u=>String(u.email||'').toLowerCase()===mail&&u.active!==false);
  let u=find();
  if(!u){
    /* רשימת המשתמשים אולי עוד לא הגיעה מהשרת — מחכים רגע לפני שמסיקים מסקנות */
    if((tries||0)<6)return setTimeout(()=>resolveMe((tries||0)+1),500);
    /* המשתמש הראשון שנכנס לסביבה ריקה הופך למנהל */
    if(!db.users.some(x=>x.email)){
      u={id:uid(),name:_authUser.displayName||mail.split('@')[0],email:mail,code:'',role:'admin',active:true};
      db.users.push(u);save(true);
    } else {
      toast('החשבון '+mail+' לא מוגדר כמשתמש במערכת — לפנות למנהל');
      liveSignOut();return;
    }
  }
  me=u;sessionStorage.setItem('vas_me',u.id);
  if(FSM)liveSubscribeData(FSM,u.role);
  logAct('כניסה למערכת');save(true);
  if(!view||view==='dash')go('dash'); else render();
  toast('שלום '+u.name.split(' ')[0]);
}
function liveSignOut(){
  if(AUTH&&AUTHM)AUTHM.signOut(AUTH).catch(()=>{});
  me=null;_authUser=null;sessionStorage.removeItem('vas_me');renderLogin();
}
/* אם הענן עדיין ריק — מעלים אליו את מה שיש כאן. אחרת מקבלים ממנו. */
async function liveFirstSync(F){
  const metaRef=F.doc(FSdb,PFX+'meta','settings');
  const snap=await F.getDoc(metaRef);
  if(!snap.exists()){
    await F.setDoc(metaRef,Object.assign(liveSettings(db.settings),{seeded:true}));
    const B=F.writeBatch(FSdb);

function subColl(F,c){
  if(_subbed[c])return;_subbed[c]=1;
  const un=F.onSnapshot(F.collection(FSdb,PFX+c),s=>{
    let arr=s.docs.map(d=>unpackDoc(c,d.data(),F));
    if(c==='log')arr.sort((a,b)=>(b.t||'').localeCompare(a.t||''));
    db[c]=arr;

    if(c==='users'&&me){
      const m=db.users.find(u=>u.id===me.id)||
              db.users.find(u=>u.email&&normMail(u.email)===normMail(me.email));
      if(m&&m.active===false){toast('המשתמש שלך הושבת על ידי המנהל');return logout();}
      if(m)me=m;
      else if(authUsersMode()){toast('המשתמש שלך הוסר מהמערכת');return logout();}
    }
    try{localStorage.setItem(KEY,JSON.stringify(db));}catch(e){}
    scheduleRender();
  },e=>{
    /* דחיית הרשאה על אוסף שלא שייך לתפקיד היא תקינה ולא תקלה */
    if(String(e.code||'').indexOf('permission')<0){_liveErr=String(e.message||e);_syncState='err';paintSync();}
  });

function livePush(){
  const F=FSM;if(!F||!FSdb)return;
  const skipped=[];
  try{
    liveColls().forEach(c=>{
      const L=idx(db[c]||[]),B=idx((_base&&_base[c])||[]);
      Object.keys(L).forEach(id=>{
        if(JSON.stringify(L[id])===JSON.stringify(B[id]))return;
        if(_chunkPending[chunkKey(c,id)]){skipped.push([c,id]);return;}   /* עוד לא הגיעו כל החלקים — לא דורסים */
        const pk=packDoc(c,L[id],F);
        pk.ready.then(()=>F.setDoc(F.doc(FSdb,PFX+c,id),pk.doc)).catch(e=>liveWriteFail(c,id,e));});
      if(c!=='log')Object.keys(B).forEach(id=>{if(!L[id]){F.deleteDoc(F.doc(FSdb,PFX+c,id)).catch(()=>{});if(PACK[c])chunksDelete(c,id);}});
    });
    const s=liveSettings(db.settings);
    if(JSON.stringify(s)!==JSON.stringify(liveSettings((_base&&_base.settings)||{})))
      F.setDoc(F.doc(FSdb,PFX+'meta','settings'),clean(s));
    _base=deep(db);
    /* רשומה שדולגה נשארת "לא נשלחה" כדי שהשמירה הבאה תנסה שוב */
    skipped.forEach(([c,id])=>{const ix=(_base[c]||[]).findIndex(x=>x&&x.id===id);if(ix>=0)_base[c].splice(ix,1);});
    saveBase();
    db.settings.lastSync=new Date().toISOString();
    _syncState='ok';paintSync();
  }catch(e){_liveErr=String(e.message||e);_syncState='err';paintSync();}
}

/* שדה חיפוש שמצייר את הרשימה מחדש בכל תו — הסמן חייב להישאר בו.
   שומרים איפה היה הפוקוס לפני הציור ומחזירים אותו אחריו. */
function focusSnap(){
  const a=document.activeElement;
  if(!a||!a.closest||!/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName))return null;
  const root=a.closest('#modal')?'#modal':(a.closest('#app')?'#app':(a.closest('.topbar')?'.topbar':null));
  if(!root)return null;
  const all=[...document.querySelectorAll(root+' input,'+root+' select,'+root+' textarea')];
  let s=null,e=null;try{s=a.selectionStart;e=a.selectionEnd;}catch(x){}
  return {root,ix:all.indexOf(a),tag:a.tagName,ph:a.placeholder||'',id:a.id||'',s,e};
}
function focusRestore(f){
  if(!f)return;
  let el=f.id?document.getElementById(f.id):null;
  if(!el&&f.ix>=0){
    const all=[...document.querySelectorAll(f.root+' input,'+f.root+' select,'+f.root+' textarea')];
    el=all[f.ix];
    if(el&&(el.tagName!==f.tag||(el.placeholder||'')!==f.ph))el=null;
  }
  if(!el)return;
  try{el.focus({preventScroll:true});}catch(x){el.focus();}
  try{if(f.s!=null&&el.setSelectionRange)el.setSelectionRange(f.s,f.e);}catch(x){}
}

function closeGres(){const e=document.getElementById('gres');if(e)e.classList.remove('on');}
function gsearch(){
  const q=(document.getElementById('gq').value||'').trim().toLowerCase();
  const box=document.getElementById('gres');
  if(q.length<2){box.classList.remove('on');return;}
  const hit=[];
  const has=(...parts)=>parts.filter(Boolean).join(' ').toLowerCase().includes(q);
  const add=(k,label,extra,open)=>{if(hit.length<40)hit.push({k,label,extra,open});};
  const lim=a=>a.slice(0,6);

  lim(db.clients.filter(c=>has(c.name,c.taxId,c.city,...contactsOf(c).map(x=>x.name+' '+x.phone+' '+x.email))))
    .forEach(c=>add('לקוח',c.name,c.city||c.taxId||'',`cliForm('${c.id}')`));
  lim(db.projects.filter(p=>has(p.name,p.code,p.city,p.address,client(p.clientId).name)))
    .forEach(p=>add('פרויקט',p.name,client(p.clientId).name,`projForm('${p.id}')`));
  lim((db.quotes||[]).filter(q=>has(q.num,q.title,client(q.clientId).name,...(q.lines||[]).map(l=>l.desc))))
    .forEach(q=>add('הצעת מחיר',q.num+(q.title?' · '+q.title:''),client(q.clientId).name+' · '+money(quoteCalc(q).net),`quoteView('${q.id}')`));
  lim(db.contracts.filter(c=>has(c.name,c.num,c.disc)))
    .forEach(c=>add('חוזה',c.name,project(c.projectId).name,`conForm('${c.id}')`));
  lim(db.cinv.filter(i=>has(i.num,i.notes)))
    .forEach(i=>add('חשבון ללקוח',i.num,client(cinvClient(i)).name+' · '+money(cinvCalc(i).total),`cinvView('${i.id}')`));
  lim((db.masters||[]).filter(m=>has(m.num)))
    .forEach(m=>add('חשבון מרכז',m.num,client(m.cliId).name,`masterView('${m.id}')`));
  lim(db.subs.filter(s=>has(s.name,s.taxId,s.trade,...contactsOf(s).map(x=>x.name+' '+x.phone+' '+x.email))))
    .forEach(s=>add('קבלן משנה',s.name,s.trade||'',`subForm('${s.id}')`));
  lim(db.sinv.filter(i=>has(i.num)))
    .forEach(i=>add('חשבון קבלן',i.num,subc(i.subId).name,`sinvForm('${i.id}')`));
  lim(db.suppliers.filter(s=>has(s.name,s.taxId,s.cat,...contactsOf(s).map(x=>x.name+' '+x.phone+' '+x.email))))
    .forEach(s=>add('ספק',s.name,s.cat||'',`supForm('${s.id}')`));
  lim(db.pos.filter(p=>has(p.num,p.notes,p.ctName)))
    .forEach(p=>add('הזמנת רכש',p.num,supp(p.supId).name,`poForm('${p.id}')`));
  lim(db.dns.filter(d=>has(d.num)))
    .forEach(d=>add('תעודת משלוח',d.num,supp(d.supId).name,`dnForm('${d.id}')`));
  lim(db.pinv.filter(i=>has(i.num)))
    .forEach(i=>add('חשבונית ספק',i.num,supp(i.supId).name+' · '+money(i.gross||0),`pinvForm('${i.id}')`));
  lim(db.stock.filter(s=>has(s.sku,s.desc,s.loc)))
    .forEach(s=>add('פריט מלאי',s.desc,(s.sku?s.sku+' · ':'')+'יתרה '+s.qty,`stkForm('${s.id}')`));
  lim((db.tasks||[]).filter(t=>has(t.title,t.phase)))
    .forEach(t=>add('משימה',t.title,project(t.projectId).name,`taskForm('${t.id}')`));
  /* פריטים בתוך המחירונים */
  (db.plists||[]).forEach(pl=>{
    lim((pl.items||[]).filter(i=>has(i.sku,i.desc))).forEach(i=>
      add('מחירון '+plParty(pl).name,i.desc,(i.sku?i.sku+' · ':'')+money2(i.price),`plView('${pl.id}')`));
  });

  box.innerHTML=hit.length?hit.map((h,ix)=>`<button onclick="gopen(${ix})">
    <span class="k">${h.k}</span> · ${esc(h.label)} ${h.extra?`<span class="k">${esc(h.extra)}</span>`:''}</button>`).join('')
    :'<div class="empty" style="padding:20px"><b>לא נמצא</b>אפשר לחפש לקוח, ספק, קבלן, פרויקט, חוזה, חשבון, תעודה, פריט מלאי או פריט במחירון</div>';
  window._gres=hit;
  box.classList.add('on');
}

/* =========================================================================
   מנוע פיננסי
   ========================================================================= */
function boqTotal(c){return (c.boq||[]).reduce((s,l)=>s+(Number(l.qty)||0)*(Number(l.price)||0),0);}
function boqCost(c){return (c.boq||[]).reduce((s,l)=>s+(Number(l.qty)||0)*((Number(l.cmat)||0)+(Number(l.clab)||0)),0);}
function boqLine(c,id){return (c.boq||[]).find(x=>x.id===id)||{price:0,desc:'',qty:0};}

function cinvCum(inv){
  const c=contract(inv.contractId);
  const items=(inv.cum||[]).reduce((s,x)=>s+(Number(x.qty)||0)*(Number(boqLine(c,x.boqId).price)||0),0);
  const ex=(inv.extras||[]).reduce((s,x)=>s+(Number(x.amount)||0),0);
  return items+ex;
}
function cinvOrder(inv){return (inv.periodTo||inv.date||'')+'|'+(inv.num||'');}
function cinvPrev(inv){
  return db.cinv.filter(x=>x.contractId===inv.contractId&&x.id!==inv.id&&cinvOrder(x)<cinvOrder(inv))
    .reduce((s,x)=>Math.max(s,cinvCum(x)),0);
}
function cinvCalc(inv){
  const cum=cinvCum(inv), prev=cinvPrev(inv), period=cum-prev;
  const ret=period*((inv.retPct==null?0:inv.retPct)/100);
  const net=period-ret;
  const vatPct=vatOf(inv);
  const vat=net*vatPct/100;
  return {cum,prev,period,ret,net,vatPct,vat,total:net+vat};
}
function sinvOrder(inv){return (inv.periodTo||inv.date||'')+'|'+(inv.num||'');}
function sinvPrev(inv){
  return db.sinv.filter(x=>x.subId===inv.subId&&x.projectId===inv.projectId&&x.id!==inv.id&&sinvOrder(x)<sinvOrder(inv))
    .reduce((s,x)=>Math.max(s,Number(x.cum)||0),0);
}
/* שיעור ניכוי המס במקור בפועל: לפי האישור אם הוא בתוקף בתאריך החשבון */
function taxRateFor(party,dateStr){
  if(!party)return 0;
  const d=dateStr||today();
  const certOk=party.taxCert&&party.taxCert>=d;
  return certOk?(Number(party.taxPct)||0)
               :(party.taxCert?(Number(party.taxPctNoCert)||0):(Number(party.taxPct)||0));
}
function vatOf(doc){return doc&&doc.vat!=null?Number(doc.vat):VAT;}
function sinvCalc(inv){
  const cum=Number(inv.cum)||0, prev=sinvPrev(inv), period=cum-prev;
  const s=subc(inv.subId);
  const ins=period*((inv.insPct==null?INSURANCE:inv.insPct)/100);
  const ret=period*((inv.retPct==null?RETENTION:inv.retPct)/100);
  const net=period-ins-ret;
  const vatPct=(s&&s.exempt)?0:vatOf(inv);
  const vat=net*vatPct/100;
  /* ניכוי מס במקור מחושב על הסכום לפני מע״מ ומנוכה מהתשלום בפועל */
  const taxPct=(inv.taxPct!=null)?Number(inv.taxPct):taxRateFor(s,inv.date);
  const tax=net*taxPct/100;
  return {cum,prev,period,ins,ret,net,vatPct,vat,tax,taxPct,
    gross:net+vat, total:net+vat-tax};
}
/* יתרת תשלום בפועל לחשבון קבלן */
function sinvPaid(id){return (db.payments||[]).filter(p=>p.sinvId===id).reduce((s,p)=>s+(Number(p.amount)||0),0);}
function sinvOpen(i){return sinvCalc(i).total-sinvPaid(i.id);}
function cinvPaid(id){return (db.payments||[]).filter(p=>p.cinvId===id).reduce((s,p)=>s+(Number(p.amount)||0),0);}
function cinvOpen(i){return cinvCalc(i).total-cinvPaid(i.id);}
/* מועד פירעון לחשבון לקוח לפי תנאי הפרויקט או הלקוח */
function cinvDue(i){
  if(i.due)return i.due;
  const c=contract(i.contractId),p=project(c.projectId),cl=client(p.clientId);
  return calcDue(i.date,p.terms||cl.terms||'שוטף+60');
}
function lineTotal(l){return (Number(l.qty)||0)*(Number(l.price)||0)*(1-(Number(l.disc)||0)/100);}
function poTotals(p){
  const net=(p.lines||[]).reduce((s,l)=>s+lineTotal(l),0);
  const v=net*((p.vat==null?VAT:p.vat)/100);
  return {net,vat:v,gross:net+v};
}
function deliveredQty(poId,lineId){
  return db.dns.filter(d=>d.poId===poId).reduce((s,d)=>s+(d.lines||[]).filter(l=>l.poLineId===lineId).reduce((a,l)=>a+(Number(l.qty)||0),0),0);
}
function poDeliveredValue(id){const p=po(id);if(!p)return 0;
  return (p.lines||[]).reduce((s,l)=>s+deliveredQty(id,l.id)*(Number(l.price)||0)*(1-(Number(l.disc)||0)/100),0);}
function poInvoicedValue(id){return db.pinv.filter(i=>i.poId===id).reduce((s,i)=>s+(Number(i.net)||0),0);}
function supplyState(p){
  const L=p.lines||[];if(!L.length)return {k:'אין שורות',c:'t-gray'};
  let full=0,part=0;
  L.forEach(l=>{const d=deliveredQty(p.id,l.id);if(d>=(Number(l.qty)||0)&&d>0)full++;else if(d>0)part++;});
  if(full===L.length)return {k:'סופק במלואו',c:'t-green'};
  if(full||part)return {k:'סופק חלקית',c:'t-amber'};
  return {k:'ממתין לאספקה',c:'t-gray'};
}
function invPaid(id){return db.payments.filter(p=>p.invId===id).reduce((s,p)=>s+(Number(p.amount)||0),0);}
function pinvOpen(i){return (Number(i.gross)||0)-invPaid(i.id);}

/* --- רווח והפסד לפי פרויקט --- */
function projectPnL(pid){
  const cons=db.contracts.filter(c=>c.projectId===pid);
  const conIds=cons.map(c=>c.id);
  const contractSum=cons.reduce((s,c)=>s+(Number(c.sum)||boqTotal(c)),0);
  const revenue=db.cinv.filter(i=>conIds.includes(i.contractId)&&i.status!=='טיוטה')
    .reduce((s,i)=>s+cinvCalc(i).period,0);
  const revDraft=db.cinv.filter(i=>conIds.includes(i.contractId))
    .reduce((s,i)=>s+cinvCalc(i).period,0);
  const subCost=db.sinv.filter(i=>i.projectId===pid).reduce((s,i)=>s+sinvCalc(i).period,0);
  /* רכש שנקלט למחסן לא נזקף לפרויקט בעת הקנייה אלא בעת הניפוק — כדי לא לספור פעמיים */
  const buyCost=db.pinv.filter(i=>i.projectId===pid).reduce((s,i)=>{
    const toStock=(i.dnIds||[]).reduce((a,x)=>{const d=byId(db.dns,x);
      return a+((d&&d.toStock)?(d.lines||[]).reduce((b,l)=>b+(Number(l.qty)||0)*(Number(l.price)||0),0):0);},0);
    return s+Math.max(0,(Number(i.net)||0)-toStock);},0);
  const stockCost=db.moves.filter(m=>m.projectId===pid&&m.type==='ניפוק').reduce((s,m)=>s+(Number(m.qty)||0)*(Number(m.cost)||0),0);
  const otherCost=(db.costs||[]).filter(c=>c.projectId===pid).reduce((s,c)=>s+(Number(c.amount)||0),0);
  const cost=subCost+buyCost+stockCost+otherCost;
  return {contractSum,revenue,revDraft,subCost,buyCost,stockCost,otherCost,cost,profit:revenue-cost,
    margin:revenue?((revenue-cost)/revenue*100):0,exec:contractSum?revenue/contractSum*100:0};
}
function openReceivable(){
  return db.cinv.filter(i=>i.status==='הוגש ללקוח'||i.status==='אושר')
    .reduce((s,i)=>s+cinvCalc(i).total,0);
}
function openPayable(){
  const subs=db.sinv.filter(i=>i.status!=='שולם').reduce((s,i)=>s+sinvCalc(i).total,0);
  const sup=db.pinv.reduce((s,i)=>s+pinvOpen(i),0);
  return {subs,sup,total:subs+sup};
}

VIEWS.dash=function(){
  if(me.role==='field')return fieldDash();
  const active=db.projects.filter(p=>p.status==='בביצוע'||p.status==='בהקמה');
  let sum=0,rev=0,cost=0;
  db.projects.forEach(p=>{const x=projectPnL(p.id);sum+=x.contractSum;rev+=x.revenue;cost+=x.cost;});
  const rec=openReceivable(), pay=openPayable();
  const openPO=db.pos.filter(p=>p.status!=='בוטלה'&&supplyState(p).k!=='סופק במלואו');
  const dueCinv=db.cinv.filter(i=>i.status==='הוגש ללקוח'||i.status==='אושר').sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  const duePay=[...db.pinv.filter(i=>pinvOpen(i)>1).map(i=>({d:i.due,n:i.num,who:supp(i.supId).name,amt:pinvOpen(i),t:'ספק',id:i.id,k:'p'})),
    ...db.sinv.filter(i=>i.status!=='שולם').map(i=>({d:i.due||i.date,n:i.num,who:subc(i.subId).name,amt:sinvCalc(i).total,t:'קבלן',id:i.id,k:'s'}))]
    .sort((a,b)=>(a.d||'').localeCompare(b.d||'')).slice(0,8);
  const alerts=[];
  /* פרויקט פעיל שלא הוצא לו חשבון החודש — הדבר הראשון שבודקים בתחילת חודש */
  const thisMonth=today().slice(0,7);
  active.forEach(p=>{
    const cons=db.contracts.filter(c=>c.projectId===p.id);
    if(!cons.length)return;
    const last=db.cinv.filter(i=>cons.some(c=>c.id===i.contractId))
      .map(i=>i.periodTo||i.date||'').sort().pop();
    if(!last||last.slice(0,7)<thisMonth){
      const days=last?daysBetween(last,today()):null;
      alerts.push({t:'לא הוצא חשבון ל'+p.name+(last?' כבר '+days+' ימים':' מעולם'),go:`projView('${p.id}')`});
    }
  });
  {const bad=scanBroken();
   if(bad.length)alerts.push({t:bad.length+' רשומות עם טקסט משובש מייבוא קודם — כדאי לנקות ולייבא מחדש',go:`dataCheck()`});}
  /* הצעות מחיר שממתינות לתשובה ועומדות לפוג — זמן להרים טלפון */
  (db.quotes||[]).filter(q=>q.status==='נשלחה'&&q.valid&&q.valid>=today()&&daysBetween(today(),q.valid)<=7)
    .forEach(q=>alerts.push({t:'הצעת מחיר '+q.num+' ל'+client(q.clientId).name+' פגה ב-'+dt(q.valid)+' — כדאי להתקשר',go:`quoteView('${q.id}')`}));
  (db.quotes||[]).filter(quoteExpired).slice(0,3)
    .forEach(q=>alerts.push({t:'הצעת מחיר '+q.num+' ל'+client(q.clientId).name+' פגה בלי תשובה',go:`quoteView('${q.id}')`}));
  db.subs.filter(s=>s.taxCert&&s.taxCert>=today()&&daysBetween(today(),s.taxCert)<=30)
    .forEach(s=>alerts.push({t:'אישור ניכוי מס של '+s.name+' פג ב-'+dt(s.taxCert),go:`subView('${s.id}')`}));
  db.subs.filter(s=>s.taxCert&&s.taxCert<today())
    .forEach(s=>alerts.push({t:'אין אישור ניכוי מס בתוקף ל'+s.name+' — מנוכה השיעור המלא',go:`subView('${s.id}')`}));
  db.pos.filter(p=>p.needBy&&p.needBy<today()&&supplyState(p).k!=='סופק במלואו'&&p.status!=='בוטלה')
    .forEach(p=>alerts.push({t:'הזמנת רכש '+p.num+' עברה את תאריך האספקה ('+dt(p.needBy)+')',go:`poView('${p.id}')`}));
  db.pinv.filter(i=>pinvOpen(i)>1&&daysLate(i.due)>0).forEach(i=>alerts.push({t:'חשבונית ספק '+i.num+' בפיגור '+daysLate(i.due)+' ימים',go:`payForm('${i.id}','pinv')`}));
  db.dns.filter(d=>!db.pinv.some(i=>(i.dnIds||[]).includes(d.id))).slice(0,5)
    .forEach(d=>alerts.push({t:'תעודת משלוח '+d.num+' עדיין ללא חשבונית מהספק',go:`dnForm('${d.id}')`}));
  db.cinv.filter(i=>i.status==='טיוטה').forEach(i=>alerts.push({t:'חשבון '+i.num+' עדיין בסטטוס טיוטה — לא הוגש ללקוח',go:`cinvView('${i.id}')`}));
  db.projects.forEach(p=>budgetRows(p).forEach(r=>{
    if(r.plan&&r.act>r.plan)alerts.push({t:'חריגה תקציבית ב'+p.name+' — סעיף '+r.cat+': '+money(r.act-r.plan)+' מעל התקציב',go:`go('rep','budget')`});}));
  (db.tasks||[]).filter(taskLate).slice(0,5).forEach(t=>alerts.push({t:'משימה בפיגור: '+t.title+' ('+project(t.projectId).name+') — יעד '+dt(t.due),go:`taskForm('${t.id}')`}));
  subMonitor().filter(r=>r.approved&&r.gap>1).slice(0,5).forEach(r=>
    alerts.push({t:'חיוב גבוה מהמחירון: '+r.sub.name+' ב'+project(r.pid).name+' — פער '+money(r.gap),go:`go('buy','plists')`}));

  window._alerts=alerts;
  document.getElementById('app').innerHTML=`
  <div class="head"><div><h1>שלום ${esc(me.name.split(' ')[0])}</h1>
  <div class="sub">${active.length} פרויקטים פעילים · ${dt(today())}</div></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
    <button class="btn" onclick="cinvForm()">+ חשבון ללקוח</button>
    <button class="btn sec" onclick="poForm()">+ הזמנת רכש</button>
    <button class="btn sec" onclick="dnForm()">+ תעודת משלוח</button>
  </div></div>
  <div class="kpis">
    <div class="kpi b"><div class="l">היקף חוזים</div><div class="v">${money(sum)}</div><div class="n">${db.contracts.length} חוזים</div></div>
    <div class="kpi"><div class="l">בוצע מצטבר</div><div class="v">${money(rev)}</div><div class="n">${pct(rev,sum)}% מהיקף החוזים</div></div>
    <div class="kpi v"><div class="l">עלויות מצטברות</div><div class="v">${money(cost)}</div><div class="n">קבלנים, רכש ומלאי</div></div>
    <div class="kpi g"><div class="l">רווח גולמי</div><div class="v">${money(rev-cost)}</div><div class="n">${rev?Math.round((rev-cost)/rev*100):0}% מהמחזור</div></div>
    <div class="kpi a"><div class="l">לגבייה מלקוחות</div><div class="v">${money(rec)}</div><div class="n">כולל מע״מ</div></div>
    <div class="kpi r"><div class="l">לתשלום</div><div class="v">${money(pay.total)}</div><div class="n">קבלנים ${money(pay.subs)} · ספקים ${money(pay.sup)}</div></div>
  </div>

  ${alerts.length?`<div class="card pad" style="margin-bottom:16px">
    <div class="section-title" style="margin-top:0">דורש טיפול (${alerts.length})</div>
    ${alerts.slice(0,9).map((a,ix)=>`<div class="alert warn alertrow" style="margin-bottom:6px"
       onclick="dashAlert(${ix})" role="button" tabindex="0"
       onkeydown="if(event.key==='Enter')dashAlert(${ix})">${esc(a.t||a)}<span class="go">←</span></div>`).join('')}
    ${alerts.length>9?`<div class="hint">ועוד ${alerts.length-9} התראות</div>`:''}</div>`:
    '<div class="alert ok">אין התראות פתוחות. הכל מעודכן.</div>'}

  ${dashCharts()}

  <div class="grid g2" style="margin-top:16px">
    <div class="card"><div class="pad" style="padding-bottom:0"><div class="section-title" style="margin-top:0">חשבונות ללקוח שממתינים לתשלום</div></div>
    ${T([
      {l:'חשבון',f:r=>`<button class="linkbtn" onclick="cinvView('${r.id}')">${esc(r.num)}</button>`},
      {l:'לקוח / פרויקט',f:r=>{const c=contract(r.contractId);return esc(client(project(c.projectId).clientId).name)+'<div style="font-size:12px;color:var(--muted)">'+esc(project(c.projectId).name)+'</div>';}},
      {l:'תקופה',f:r=>dt(r.periodTo),cls:'num'},
      {l:'סכום',f:r=>money(cinvCalc(r).total),cls:'num mono'},
      {l:'סטטוס',f:r=>tag(r.status,STAG[r.status])}
    ],dueCinv.slice(0,7),'אין חשבונות פתוחים','כל מה שהוגש כבר שולם.')}</div>

    <div class="card"><div class="pad" style="padding-bottom:0"><div class="section-title" style="margin-top:0">תשלומים קרובים</div></div>
    ${T([
      {l:'מועד',f:r=>`<span style="${daysLate(r.d)?'color:var(--red);font-weight:700':''}">${dt(r.d)}</span>`,cls:'num'},
      {l:'מסמך',f:r=>`<button class="linkbtn" onclick="${r.k==='p'?`pinvView('${r.id}')`:`sinvView('${r.id}')`}">${esc(r.n)}</button>`},
      {l:'למי',f:r=>esc(r.who)},
      {l:'סוג',f:r=>tag(r.t,r.t==='ספק'?'t-blue':'t-violet')},
      {l:'סכום',f:r=>money(r.amt),cls:'num mono'}
    ],duePay,'אין תשלומים פתוחים','לא רשום חוב לספקים או לקבלנים.')}</div>
  </div>

  <div class="card" style="margin-top:16px"><div class="pad" style="padding-bottom:0">
  <div class="section-title" style="margin-top:0">פרויקטים פעילים</div></div>
  ${T([
    {l:'פרויקט',f:p=>`<button class="linkbtn" onclick="projView('${p.id}')">${esc(p.name)}</button><div style="font-size:12px;color:var(--muted)">${esc(client(p.clientId).name)}</div>`},
    {l:'סטטוס',f:p=>tag(p.status,STAG[p.status])},
    {l:'היקף חוזים',f:p=>money(projectPnL(p.id).contractSum),cls:'num mono'},
    {l:'בוצע',f:p=>money(projectPnL(p.id).revenue),cls:'num mono'},
    {l:'התקדמות',f:p=>{const x=projectPnL(p.id);return `<div class="bar-mini"><i style="width:${Math.min(100,x.exec)}%"></i></div><div style="font-size:11px;color:var(--muted)">${Math.round(x.exec)}%</div>`;}},
    {l:'עלויות',f:p=>money(projectPnL(p.id).cost),cls:'num mono'},
    {l:'רווח',f:p=>{const x=projectPnL(p.id);return `<span style="color:${x.profit>=0?'var(--green)':'var(--red)'};font-weight:800">${money(x.profit)}</span>`;},cls:'num'},
    {l:'מרווח',f:p=>Math.round(projectPnL(p.id).margin)+'%',cls:'num'}
  ],active,'אין פרויקטים פעילים','פתח פרויקט חדש במסך פרויקטים.')}</div>

  ${db.settings.demo?`<div class="alert info" style="margin-top:16px">במערכת יש נתוני דוגמה כדי שתוכלו להתאמן. <button class="linkbtn" onclick="clearDemo()">מחיקת נתוני הדוגמה והתחלה נקייה</button></div>`:''}`;
};
function dashAlert(ix){
  const a=(window._alerts||[])[ix];
  if(!a||!a.go)return;
  try{eval(a.go);}catch(e){}
}

  const low=db.stock.filter(i=>i.min&&Number(i.qty)<Number(i.min));

    {l:'הזמנה',f:p=>esc(p.num)},{l:'ספק',f:p=>esc(supp(p.supId).name)},

    {l:'אספקה עד',f:p=>`<span style="${p.needBy&&p.needBy<today()?'color:var(--red);font-weight:700':''}">${dt(p.needBy)}</span>`,cls:'num'},
    {l:'מצב',f:p=>{const s=supplyState(p);return tag(s.k,s.c);}},

  ],openPO,'אין משלוחים פתוחים','')}</div>`;

function clearDemo(){
  if(!confirm('למחוק את כל נתוני הדוגמה? המשתמשים וההגדרות יישארו.'))return;
  ['clients','projects','contracts','cinv','subs','sinv','suppliers','pos','dns','pinv','payments','stock','moves','quotes','plists','masters','tasks','costs','subwork','retrel']
    .forEach(k=>db[k]=[]);
  db.settings.demo=false;db.settings.seq={};
  save();render();toast('המערכת נקייה ומוכנה לעבודה');
}

function cliForm(id){
  const o=id?byId(db.clients,id):{};
  const rid=id||uid();window._fid=rid;ctInit(o);
  openModal(id?'עריכת לקוח':'לקוח חדש',F(CLI_F,o)+ctBlock()+attPanel('client',rid,'מסמכים (חוזה מסגרת, אישורים, תכתובת)'),
    `<button class="btn" onclick="cliSave('${id||''}')">${batchOn('clients',id)?'שמירה והבא':'שמירה'}</button>${batchBtns('clients',id)}${delBtn('clients',id)}<button class="btn sec" onclick="closeModal()">ביטול</button>`,true);
  ctPaint();attPaint('client',rid);
}
function cliSave(id){
  const o=Object.assign(RF(CLI_F),ctCollect());
  if(!o.name.trim())return toast('צריך שם לקוח');
  if(id){const ex=byId(db.clients,id);if(!ex)return toast('הלקוח נמחק בינתיים על ידי משתמש אחר');Object.assign(ex,o);} else {o.id=window._fid||uid();db.clients.push(o);}
  logAct((id?'עודכן':'נוסף')+' לקוח '+o.name);save();closeModalSaved();render();toast('נשמר');
  batchAfter('clients',id);
}

let _boq=[];
function boqEdit(id,keep){
  const c=byId(db.contracts,id);
  if(!keep)_boq=JSON.parse(JSON.stringify(c.boq||[]));
  if(!_boq.length)_boq.push(newBoqLine());
  openModal('כתב כמויות — '+c.name,`
  <div class="alert info">מחיר = מה שהלקוח משלם. עלות חומר ועבודה = מה שזה עולה לנו. מהפער נבנה הרווח בכל סעיף.</div>
  <div id="boqArea"></div>
  <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">
    <button class="btn sec sm" onclick="boqAdd()">+ סעיף</button>
    <button class="btn sec sm" onclick="boqImport('${id}')">ייבוא מאקסל</button>
    <button class="btn sec sm" onclick="boqExport('${id}')">ייצוא</button>
  </div>
  <div class="totbox"><div class="tot" id="boqTot"></div></div>`,
  `<button class="btn" onclick="boqSave('${id}')">שמירת כתב הכמויות</button><button class="btn sec" onclick="closeModal()">ביטול</button>`,true);
  boqDraw();
}
function newBoqLine(){return {id:uid(),sku:'',desc:'',unit:'יח׳',qty:1,price:0,cmat:0,clab:0};}
function boqAdd(){_boq.push(newBoqLine());boqDraw();}
function boqRm(i){_boq.splice(i,1);if(!_boq.length)_boq.push(newBoqLine());boqDraw();}
function boqUp(i,f,v){_boq[i][f]=['qty','price','cmat','clab'].includes(f)?(Number(v)||0):v;boqTot();}
function boqDraw(){
  document.getElementById('boqArea').innerHTML=`<div class="tbl-wrap"><table class="lines">
  <thead><tr><th style="width:80px">סעיף</th><th>תיאור</th><th style="width:60px">יח׳</th><th style="width:80px">כמות</th>
  <th style="width:95px">מחיר ללקוח</th><th style="width:95px">עלות חומר</th><th style="width:95px">עלות עבודה</th>
  <th style="width:100px">סה״כ</th><th style="width:95px">רווח</th><th style="width:34px"></th></tr></thead>
  <tbody>${_boq.map((l,i)=>`<tr>
    <td><input value="${esc(l.sku)}" onchange="boqUp(${i},'sku',this.value)"></td>
    <td><input value="${esc(l.desc)}" onchange="boqUp(${i},'desc',this.value)"></td>
    <td><input value="${esc(l.unit||'')}" onchange="boqUp(${i},'unit',this.value)"></td>
    <td><input type="number" step="0.01" value="${l.qty}" oninput="boqUp(${i},'qty',this.value)"></td>
    <td><input type="number" step="0.01" value="${l.price}" oninput="boqUp(${i},'price',this.value)"></td>
    <td><input type="number" step="0.01" value="${l.cmat||0}" oninput="boqUp(${i},'cmat',this.value)"></td>
    <td><input type="number" step="0.01" value="${l.clab||0}" oninput="boqUp(${i},'clab',this.value)"></td>
    <td class="num mono" id="bt${i}"></td><td class="num" id="bg${i}"></td>
    <td><button class="rm" onclick="boqRm(${i})">✕</button></td></tr>`).join('')}
  </tbody></table></div>`;
  boqTot();
}
function boqTot(){
  let rev=0,cost=0;
  _boq.forEach((l,i)=>{
    const t=(Number(l.qty)||0)*(Number(l.price)||0);
    const cc=(Number(l.qty)||0)*((Number(l.cmat)||0)+(Number(l.clab)||0));
    rev+=t;cost+=cc;
    const a=document.getElementById('bt'+i),b=document.getElementById('bg'+i);
    if(a)a.textContent=money2(t);
    if(b){b.innerHTML=`<span style="color:${t-cc>=0?'var(--green)':'var(--red)'};font-weight:700">${money(t-cc)}</span>`;}
  });
  const box=document.getElementById('boqTot');
  if(box)box.innerHTML=`<div><span>סה״כ לחיוב הלקוח</span><b class="mono">${money2(rev)}</b></div>
    <div><span>עלות מתוכננת</span><b class="mono">${money2(cost)}</b></div>

function cinvTot(){
  const c=contract(fv('contractId'));
  let cum=0;
  (c.boq||[]).forEach(l=>{
    const q=cinvGet(l.id), v=q*l.price; cum+=v;
    const a=document.getElementById('cv_'+l.id), b=document.getElementById('cp_'+l.id);
    if(a)a.textContent=money2(v); if(b)b.textContent=pct(q,l.qty)+'%';
  });
  cum+=_ext.reduce((s,e)=>s+(Number(e.amount)||0),0);
  const fake={contractId:c.id,id:window._editing||'__new__',cum:_cum,extras:_ext,periodTo:fv('periodTo'),num:fv('num'),retPct:Number(fv('retPct'))||0};
  const prev=cinvPrev(fake), period=cum-prev;
  const ret=period*(fake.retPct/100), net=period-ret, vat=net*VAT/100;
  const box=document.getElementById('cinvTot');
  if(box)box.innerHTML=`<div><span>מצטבר עד היום</span><b class="mono">${money2(cum)}</b></div>
   <div><span>חשבונות קודמים</span><b class="mono">${money2(prev)}</b></div>
   <div><span>לתקופה זו</span><b class="mono">${money2(period)}</b></div>
   ${ret?`<div class="neg"><span>עיכבון ${fake.retPct}%</span><b class="mono">−${money2(ret)}</b></div>`:''}
   <div><span>לתשלום לפני מע״מ</span><b class="mono">${money2(net)}</b></div>
   <div><span>מע״מ ${VAT}%</span><b class="mono">${money2(vat)}</b></div>
   <div class="big"><span>סה״כ לתשלום</span><b class="mono">${money2(net+vat)}</b></div>`;
}
function cinvSave(id,print){
  const o=RF([{k:'num'},{k:'contractId'},{k:'status'},{k:'date',t:'date'},{k:'periodTo',t:'date'},
    {k:'retPct',t:'number'},{k:'vat',t:'number'},{k:'due',t:'date'},{k:'notes'}]);
  if(lockGuard(o.date))return;
  if(numGuard('cinv',o.num,id||window._fid,'החשבון'))return;
  /* בדיקת היגיון מול החוזה — טעות הקלדה בחשבון ללקוח היא הכי יקרה */
  {
    const c=contract(o.contractId);
    const over=[];
    (_cum||[]).forEach(x=>{
      const l=boqLine(c,x.boqId);
      if(l&&Number(l.qty)&&Number(x.qty)>Number(l.qty)*1.0001)
        over.push(`${l.desc||l.sku}: בוצע ${x.qty} מתוך ${l.qty} בחוזה`);
    });
    const neg=(_cum||[]).filter(x=>Number(x.qty)<0).length;
    if(neg&&!confirm('יש '+neg+' סעיפים עם כמות שלילית. להמשיך בכל זאת?'))return;
    if(over.length){
      const t=cinvTot?cinvTot():null;
      if(!confirm('חריגה מהכמויות שבחוזה ב-'+over.length+' סעיפים:\n\n'+over.slice(0,6).join('\n')+
        (over.length>6?'\n…':'')+'\n\nזה תקין רק אם סוכמו תוספות. לשמור בכל זאת?'))return;
    }
  }

  if(!o.num.trim())return toast('צריך מספר חשבון');
  o.cum=_cum.filter(x=>x.qty);o.extras=_ext.filter(x=>x.desc||x.amount);

  else {o.id=window._fid||uid();db.cinv.push(o);bumpNum('cinv');}

  save();closeModalSaved();render();toast('החשבון נשמר');
  if(print)printCinv(id||o.id);
}

function subSave(id){

/* ---------- השלמה אוטומטית מכל מחירוני הספקים ---------- */
function acCatalog(){
  const out={};
  (db.plists||[]).filter(p=>p.kind==='sup').forEach(pl=>{
    (pl.items||[]).forEach(it=>{
      const k=normKey(it.sku)||normKey(it.desc);if(!k)return;
      out[k]=out[k]||{sku:it.sku,desc:it.desc,unit:it.unit,offers:[]};
      out[k].offers.push({supId:pl.partyId,sup:plParty(pl).name,price:Number(it.price)||0});
    });
  });
  /* גם פריטי המלאי, כדי שאפשר יהיה להזמין דברים שכבר קיימים בקטלוג */
  db.stock.forEach(s=>{
    const k=normKey(s.sku)||normKey(s.desc);if(!k||out[k])return;
    out[k]={sku:s.sku,desc:s.desc,unit:s.unit,offers:[],stock:true,cost:Number(s.cost)||0};
  });
  return out;
}
function acSearch(q){
  q=String(q||'').trim().toLowerCase();
  if(q.length<2)return [];
  const cat=acCatalog();
  return Object.values(cat).filter(r=>((r.sku||'')+' '+(r.desc||'')).toLowerCase().includes(q))
    .map(r=>{
      const ps=r.offers.map(o=>o.price).filter(p=>p>0);
      const min=ps.length?Math.min(...ps):null, max=ps.length?Math.max(...ps):null;
      return {...r,min,max,best:r.offers.find(o=>o.price===min)};
    })
    .sort((a,b)=>(b.offers.length-a.offers.length)||String(a.desc).localeCompare(String(b.desc)))
    .slice(0,8);
}
let _acT=null;
function acType(i,field,val){
  plUp(i,field,val);
  clearTimeout(_acT);
  _acT=setTimeout(()=>acShow(i,val),160);
}
function acLater(){setTimeout(()=>{const b=document.getElementById('acbox');if(b&&!b.matches(':hover'))b.classList.remove('on');},220);}
function acShow(i,q){
  const box=document.getElementById('acbox');if(!box)return;
  const hits=acSearch(q);
  window._acHits=hits;window._acLine=i;
  if(!hits.length){box.classList.remove('on');return;}
  const curSup=fv('supId');
  box.innerHTML=`<div class="achead">פריטים שנמצאו במחירונים — הזול ביותר מסומן</div>
    ${hits.map((h,hi)=>{
      const offers=h.offers.slice().sort((a,b)=>a.price-b.price);
      h._sorted=offers;
      const cur=offers.find(o=>o.supId===curSup);
      const save=(cur&&h.min!=null&&cur.price>h.min)?cur.price-h.min:0;
      return `<div class="acrow">
        <div class="acmain">
          <b>${esc(h.desc||h.sku)}</b>${h.sku?`<span class="k">${esc(h.sku)}</span>`:''}
          ${h.stock?'<span class="tag t-gray">מהמלאי</span>':''}
          ${save?`<span class="tag t-red">אצל הספק הנוכחי יקר ב-${money2(save)} ליחידה</span>`:''}
        </div>
        <div class="acoffers">
          ${offers.length?offers.map((o,oi)=>`<button type="button" class="acoffer ${o.price===h.min?'best':''} ${o.supId===curSup?'cur':''}"
            onmousedown="event.preventDefault()" onclick="acPick(${hi},${oi})">
            <span>${esc(o.sup)}</span><b>${money2(o.price)}</b>${o.price===h.min?'<i>הזול</i>':''}</button>`).join('')
            :`<button type="button" class="acoffer" onmousedown="event.preventDefault()" onclick="acPick(${hi},-1)">
              <span>ללא מחירון</span><b>${money2(h.cost||0)}</b></button>`}
        </div></div>`;}).join('')}`;
  box.classList.add('on');
}
function acPick(hi,oi){
  const h=(window._acHits||[])[hi];if(!h)return;
  const i=window._acLine||0;
  const o=oi>=0?(h._sorted||h.offers)[oi]:null;
  const L=_pl[i];if(!L)return;
  L.sku=h.sku||'';L.desc=h.desc||'';L.unit=h.unit||'יח׳';
  L.price=o?o.price:(h.cost||0);
  /* מעדכנים גם את השדות שעל המסך לפני הציור מחדש, אחרת השדה שממנו הקלדנו
     מחזיר את הטקסט החלקי בזמן שהוא יוצא מהמסך ודורס את הבחירה */
  const tr=document.querySelectorAll('#plArea tbody tr')[i];
  if(tr){const ins=tr.querySelectorAll('input');
    if(ins[0])ins[0].value=L.sku;if(ins[1])ins[1].value=L.desc;
    if(ins[2])ins[2].value=L.unit;if(ins[4])ins[4].value=L.price;}
  if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
  const box=document.getElementById('acbox');if(box)box.classList.remove('on');
  const curSup=fv('supId');
  if(o&&o.supId&&o.supId!==curSup){
    const other=supp(o.supId).name;
    if(confirm('המחיר הזה הוא של '+other+', וההזמנה פתוחה על ספק אחר.\nלהעביר את ההזמנה ל'+other+'?')){
      const sel=document.getElementById('F_supId');
      if(sel){sel.value=o.supId;poSupChange();}
    }
  }
  plDraw();
}
/* ---------- השוואת מחירים לכל ההזמנה ---------- */
function poCompare(){
  const el=document.getElementById('poCompare');if(!el)return;
  const curSup=fv('supId');
  const cat=acCatalog();
  const rows=[];
  _pl.forEach(l=>{
    const k=normKey(l.sku)||normKey(l.desc);
    const c=cat[k];if(!c||!c.offers||c.offers.length<2)return;
    const offers=c.offers.slice().sort((a,b)=>a.price-b.price);
    const best=offers[0];
    const cur=offers.find(o=>o.supId===curSup);
    const basis=cur?cur.price:(Number(l.price)||0);
    if(best.supId===curSup||best.price>=basis)return;
    rows.push({desc:l.desc||l.sku,qty:Number(l.qty)||0,cur:basis,best,save:(basis-best.price)*(Number(l.qty)||0)});
  });
  if(!rows.length){el.innerHTML='';return;}

  if(id)Object.assign(byId(db.dns,id),o); else {o.id=window._fid||uid();db.dns.push(o);}
  if(o.toStock&&!wasStock)receiveToStock(o);

function receiveToStock(d){
  d.lines.forEach(l=>{
    let it=db.stock.find(s=>(l.sku&&s.sku===l.sku)||s.desc===l.desc);
    if(!it){it={id:uid(),sku:l.sku||'',desc:l.desc||'',unit:l.unit||'יח׳',qty:0,cost:Number(l.price)||0,loc:'מחסן ראשי',min:0};db.stock.push(it);}
    const oldQty=Number(it.qty)||0, addQty=Number(l.qty)||0;
    const oldCost=Number(it.cost)||0, newCost=Number(l.price)||0;
    it.cost=(oldQty+addQty)?((oldQty*oldCost+addQty*newCost)/(oldQty+addQty)):newCost;
    it.qty=oldQty+addQty;
    db.moves.push({id:uid(),date:d.date,type:'קליטה',itemId:it.id,qty:addQty,cost:newCost,
      projectId:d.projectId||'',ref:'תעודה '+d.num,by:me.name});
  });

function payForm(invId,kind){
  kind=kind||'pinv';
  const M={
    pinv:{rec:byId(db.pinv,invId),who:i=>supp(i.supId).name,open:i=>pinvOpen(i),due:i=>i.due,title:'תשלום לספק'},
    sinv:{rec:byId(db.sinv,invId),who:i=>subc(i.subId).name,open:i=>sinvOpen(i),due:i=>i.due,title:'תשלום לקבלן משנה'},
    cinv:{rec:byId(db.cinv,invId),who:i=>client(cinvClient(i)).name,open:i=>cinvOpen(i),due:i=>cinvDue(i),title:'קבלת תשלום מלקוח'}
  }[kind];
  if(!M||!M.rec)return;
  const i=M.rec, op=M.open(i);
  const prev=(db.payments||[]).filter(p=>p[kind+'Id']===invId||(kind==='pinv'&&p.invId===invId))
    .sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  let ctx='';
  if(kind==='sinv'){
    const s=subc(i.subId);
    const allOpen=db.sinv.filter(x=>x.subId===s.id).reduce((a,x)=>a+Math.max(0,sinvOpen(x)),0);
    const ret=db.sinv.filter(x=>x.subId===s.id).reduce((a,x)=>a+sinvCalc(x).ret,0)
      -(db.retrel||[]).filter(r=>r.kind==='sub'&&r.refId===s.id).reduce((a,r)=>a+(Number(r.amount)||0),0);
    const x=sinvCalc(i);
    const bad=s.taxCert&&s.taxCert<today();
    ctx=`${bad?`<div class="alert err">אישור ניכוי מס פג ב-${dt(s.taxCert)} — נוכו ${Math.round(x.taxPct)}% מהחשבון הזה.</div>`:''}
      <div class="grid g3" style="margin-bottom:12px">
        <div><label>אישור ניכוי מס</label><b>${s.taxCert?dt(s.taxCert):'לא הוזן'}</b></div>
        <div><label>סה״כ פתוח לקבלן</label><b>${money(allOpen)}</b></div>
        <div><label>עיכבון פתוח</label><b>${money(ret)}</b></div>
      </div>`;
  }
  if(kind==='pinv'){
    const s=supp(i.supId);
    const allOpen=db.pinv.filter(x=>x.supId===s.id).reduce((a,x)=>a+Math.max(0,pinvOpen(x)),0);
    ctx=`<div class="grid g3" style="margin-bottom:12px">
      <div><label>תנאי תשלום</label><b>${esc(s.terms||'—')}</b></div>
      <div><label>סה״כ פתוח לספק</label><b>${money(allOpen)}</b></div>
      <div><label>ימי פיגור</label><b>${daysLate(i.due)||0}</b></div></div>`;
  }
  openModal(M.title+' — '+i.num,`
  <div class="alert ${op>1?'info':'ok'}">${esc(M.who(i))} · יתרה ${money2(op)} · מועד ${dt(M.due(i))}</div>
  ${ctx}
  ${F([{k:'date',l:'תאריך',t:'date',d:today()},{k:'amount',l:'סכום',t:'number',step:'0.01',d:op.toFixed(2)},
    {k:'method',l:'אמצעי',t:'select',o:['העברה בנקאית','צ׳ק','מזומן','כרטיס אשראי','קיזוז']},
    {k:'ref',l:'אסמכתא / מספר צ׳ק'}],{},'g4')}
  ${prev.length?`<div class="section-title">תשלומים שנרשמו</div>
    ${T([{l:'תאריך',f:p=>dt(p.date)},{l:'סכום',f:p=>money2(p.amount),cls:'num mono'},
         {l:'אמצעי',f:p=>esc(p.method||'')},{l:'אסמכתא',f:p=>esc(p.ref||'')},
         {l:'',f:p=>`<button class="rm" onclick="payDel('${p.id}','${kind}','${invId}')">×</button>`}],prev,'','')}`:''}`,
  `<button class="btn" onclick="paySave('${invId}','${kind}')">רישום התשלום</button>
   <button class="btn sec" onclick="closeModal()">ביטול</button>`,true);
}
function payDel(pid,kind,invId){
  if(!confirm('למחוק את רישום התשלום?'))return;
  db.payments=(db.payments||[]).filter(p=>p.id!==pid);
  logAct('נמחק רישום תשלום');save();payForm(invId,kind);
}

function paySave(invId,kind){
  kind=kind||'pinv';
  const o=RF([{k:'date'},{k:'amount',t:'number'},{k:'method'},{k:'ref'}]);
  if(!o.amount)return toast('צריך סכום');
  if(periodLocked(o.date))return toast('התקופה של '+dt(o.date)+' נעולה — לפתוח אותה בהגדרות כדי לרשום');
  db.payments=db.payments||[];
  const rec={id:uid(),date:o.date,amount:o.amount,method:o.method,ref:o.ref,by:me.name};
  rec[kind+'Id']=invId;
  if(kind==='pinv')rec.invId=invId;
  db.payments.push(rec);
  /* סטטוס מתעדכן לבד כשאין יתרה */
  if(kind==='sinv'){const s=byId(db.sinv,invId);if(s&&sinvOpen(s)<=1)s.status='שולם';}
  if(kind==='cinv'){const c=byId(db.cinv,invId);if(c&&cinvOpen(c)<=1){c.status='שולם';c.paidDate=o.date;}}
  const who=kind==='pinv'?supp(byId(db.pinv,invId).supId).name
      :kind==='sinv'?subc(byId(db.sinv,invId).subId).name
      :client(cinvClient(byId(db.cinv,invId))).name;
  logAct('נרשם תשלום '+money(o.amount)+' · '+who);
  save();closeModalSaved();render();toast('התשלום נרשם');
}

function delPay(id){if(!confirm('למחוק את התשלום?'))return;db.payments=db.payments.filter(p=>p.id!==id);save();closeModalSaved();render();toast('נמחק');}

  const o=RF(STK_F);

VIEWS.cash=function(){

    const out=db.pinv.filter(i=>(i.date||'').slice(0,7)===k).reduce((s,i)=>s+(Number(i.gross)||0),0)
      +db.sinv.filter(i=>(i.date||'').slice(0,7)===k).reduce((s,i)=>s+sinvCalc(i).total,0);
    return {m:m+1,inn,out};
  });
  const mx=Math.max(1,...months.map(x=>Math.max(x.inn,x.out)));

    const open=invs.filter(i=>i.status==='הוגש ללקוח'||i.status==='אושר');
    return {c,billed:invs.reduce((s,i)=>s+cinvCalc(i).total,0),open:open.reduce((s,i)=>s+cinvCalc(i).total,0),n:open.length};
  }).filter(r=>r.billed>0).sort((a,b)=>b.open-a.open);

           {l:'פיגור',f:r=>r.late>0?tag(r.late+' ימים','t-red'):tag('בזמן','t-green')},

VIEWS.repbuy=function(){
  const year=window._by||String(new Date().getFullYear());
  const invs=db.pinv.filter(i=>(i.date||'').slice(0,4)===year);
  const tot=invs.reduce((s,i)=>s+(Number(i.net)||0),0);
  const bySup=db.suppliers.map(s=>({s,v:invs.filter(i=>i.supId===s.id).reduce((a,i)=>a+(Number(i.net)||0),0),
    n:invs.filter(i=>i.supId===s.id).length})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v);
  const byPrj={};invs.forEach(i=>{const k=i.projectId||'';byPrj[k]=(byPrj[k]||0)+(Number(i.net)||0);});
  const items={};
  db.pos.filter(p=>p.status!=='בוטלה').forEach(p=>(p.lines||[]).forEach(l=>{
    const k=(l.sku||'')+'|'+(l.desc||'');
    if(!items[k])items[k]={qty:0,val:0,sku:l.sku,desc:l.desc};
    items[k].qty+=Number(l.qty)||0;items[k].val+=lineTotal(l);}));
  const top=Object.values(items).sort((a,b)=>b.val-a.val).slice(0,12);
  const years=[...new Set(db.pinv.map(i=>(i.date||'').slice(0,4)).filter(Boolean))].sort().reverse();
  if(!years.includes(year))years.unshift(year);
  document.getElementById('app').innerHTML=`
  <div class="head"><div><h1>דוח רכש</h1><div class="sub">סה״כ ${year}: ${money(tot)} לפני מע״מ</div></div>

    <div class="card"><div class="pad" style="padding-bottom:0"><div class="section-title" style="margin-top:0">רכש לפי פרויקט</div></div>
    ${T([{l:'פרויקט',f:k=>esc(project(k[0]).name||'ללא שיוך')},{l:'סכום',f:k=>money(k[1]),cls:'num mono'},
      {l:'%',f:k=>pct(k[1],tot)+'%',cls:'num'}],Object.entries(byPrj).sort((a,b)=>b[1]-a[1]),'אין נתונים','')}</div>
  </div>
  <div class="card" style="margin-top:16px"><div class="pad" style="padding-bottom:0"><div class="section-title" style="margin-top:0">פריטים מובילים בהזמנות</div></div>
  ${T([{l:'מק״ט',f:x=>esc(x.sku||''),cls:'num'},{l:'תיאור',f:x=>esc(x.desc||'')},

function userForm(id){
  const u=id?byId(db.users,id):{role:'office',active:'1'};
  openModal(id?'עריכת משתמש':'משתמש חדש',F(USR_F,Object.assign({},u,{active:u.active===false?'0':'1'}),'g2'),
    `<button class="btn" onclick="userSave('${id||''}')">שמירה</button>${delBtn('users',id)}<button class="btn sec" onclick="closeModal()">ביטול</button>`);
}
function userSave(id){
  const o=RF(USR_F);
  if(!o.name.trim()||!o.code.trim())return toast('צריך שם וקוד');
  o.email=normMail(o.email);
  if(o.email&&db.users.some(u=>normMail(u.email)===o.email&&u.id!==id))return toast('הדוא״ל כבר משויך למשתמש אחר');
  if(!o.email&&db.users.some(u=>u.code===o.code&&u.id!==id))return toast('הקוד כבר תפוס');
  if(authUsersMode()&&!o.email)return toast('במצב כניסה אישית חובה למלא דוא״ל');
  o.active=o.active==='1';
  const ex=id?byId(db.users,id):null;
  if(ex){const oldMail=normMail(ex.email);Object.assign(ex,o);
    if(oldMail&&oldMail!==o.email)memberRemove(oldMail);
    memberWrite(ex);}
  else {o.id=uid();db.users.push(o);memberWrite(o);}
  logAct((id?'עודכן':'נוסף')+' משתמש '+o.name+(o.email?' ('+o.email+')':''));
  save();closeModalSaved();render();toast('נשמר');
}

function fileDown(filename,text,mime){
